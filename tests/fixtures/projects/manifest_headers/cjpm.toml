[package] # root metadata
  cjc-version = "1.1.0"
  name = "manifest_headers"
  organization = ""
  version = "0.1.0"
  output-type = "static"
  description = """
[workspace] # documentation example, not a table
members = ["ghost-member"]
[dependencies] # documentation example, not a table
ghost = { path = "ghost-dependency" }
"""

[workspace] # member metadata
  members = ["member"]

[dependencies] # dependency metadata
  path_dep = { path = "dep", output-type = "static" }
