[i18n]
default-language = "zh-CN"
languages = ["zh-CN", "en"]
missing-translation = "warn"

[docs]
index = "docs/index.md"

[[docs.pages]]
id = "first-catalogue"
language = "zh-CN"
source = "docs/guide.md"
route = "concepts/guides/first-catalogue"
title = "目录与资源入门"
package = "pocketkit"

[docs.pages.sections]
caller-setup = "准备调用者项目"
store-read = "保存并读取文本"
snapshot-clear = "保留快照再清空"
index-errors = "选择索引失败的处理方式"
reader-close = "关闭阅读会话"

# Maintainer-facing reproduction and local authoring steps are separated from
# the caller-facing usage guide.
[[docs.pages]]
source = "docs/reproduce.md"
route = "concepts/guides/reproduce"
title = "复现与本地生成 / Reproduce and author locally"

[external-docs.pocket_support]
index = "docs/support-symbol-index.json"
base-url = "./dependencies/support-v1"
version = "support-v1"

[lint]
severity = "warning"

# A teaching library intentionally exposes missing summary/example ranges in
# the native quality report. This floor is not a claim of contract correctness.
[coverage]
symbols = 80
parameters = 80

[[docs.pages]]
id = "first-catalogue"
language = "en"
source = "docs/en/guide.md"
route = "concepts/guides/first-catalogue"
title = "Catalogue and lifetime"
package = "pocketkit"

[docs.pages.sections]
caller-setup = "set-up-the-caller-project"
store-read = "store-and-read-text"
snapshot-clear = "keep-a-snapshot"
index-errors = "check-the-index"
reader-close = "close-the-reading-session"
