<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: cjdoc-docs-layout-a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asul:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-top-brand region chrome" data-region="top-brand"><!-- cjdoc wordmark in the global header --></div>
  <div class="r-top-search region control" data-region="top-search"><!-- command-style documentation search field: rebuild the control's chrome from the crop (comp-spec.mjs --crop top-search); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-top-version region control" data-region="top-version"><!-- version selector: rebuild the control's chrome from the crop (comp-spec.mjs --crop top-version); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-top-source region control" data-region="top-source"><!-- GitHub or source entry: rebuild the control's chrome from the crop (comp-spec.mjs --crop top-source); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-top-theme region control" data-region="top-theme"><!-- light and dark theme toggle: rebuild the control's chrome from the crop (comp-spec.mjs --crop top-theme); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-sidebar-label region text" data-region="sidebar-label"><!-- Documentation navigation label --><p style="font-size:var(--r-sidebar-label-font);line-height:1.05;margin:0">sidebar-label</p></div>
  <div class="r-sidebar-links region text" data-region="sidebar-links"><!-- Getting Started and API Reference navigation links --><p style="font-size:var(--r-sidebar-links-font);line-height:1.05;margin:0">sidebar-links</p></div>
  <div class="r-sidebar-tree region text" data-region="sidebar-tree"><!-- std package tree with core reflect io and active TypeInfo --><p style="font-size:var(--r-sidebar-tree-font);line-height:1.05;margin:0">sidebar-tree</p></div>
  <div class="r-breadcrumbs region text" data-region="breadcrumbs"><!-- API Reference breadcrumb trail --><p style="font-size:var(--r-breadcrumbs-font);line-height:1.05;margin:0">breadcrumbs</p></div>
  <div class="r-doc-overline region text" data-region="doc-overline"><!-- API REFERENCE overline --><p style="font-size:var(--r-doc-overline-font);font-family:var(--r-doc-overline-family),sans-serif;font-weight:var(--r-doc-overline-weight);line-height:1.05;margin:0">doc-overline</p></div>
  <div class="r-doc-heading region text" data-region="doc-heading"><!-- std.reflect and TypeInfo documentation heading --><p style="font-size:var(--r-doc-heading-font);line-height:1.05;margin:0">doc-heading</p></div>
  <div class="r-doc-intro region text" data-region="doc-intro"><!-- one-line symbol description --><p style="font-size:var(--r-doc-intro-font);line-height:1.05;margin:0">doc-intro</p></div>
  <div class="r-signature-label region text" data-region="signature-label"><!-- Signature section heading --><p style="font-size:var(--r-signature-label-font);line-height:1.05;margin:0">signature-label</p></div>
  <div class="r-signature-code region chrome" data-region="signature-code"><!-- Cangjie signature code panel and copy control --></div>
  <div class="r-overview region text" data-region="overview"><!-- Overview heading and paragraph --><p style="font-size:var(--r-overview-font);line-height:1.05;margin:0">overview</p></div>
  <div class="r-parameters region text" data-region="parameters"><!-- Parameters heading and parameter row --><p style="font-size:var(--r-parameters-font);line-height:1.05;margin:0">parameters</p></div>
  <div class="r-returns region text" data-region="returns"><!-- Returns heading and return row --><p style="font-size:var(--r-returns-font);line-height:1.05;margin:0">returns</p></div>
  <div class="r-examples region chrome" data-region="examples"><!-- Cangjie example code panel --></div>
  <div class="r-toc region text" data-region="toc"><!-- On this page outline --><p style="font-size:var(--r-toc-font);line-height:1.05;margin:0">toc</p></div>
</main>
</body>
</html>
