name: Deploy showcase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'scripts/build_showcase.py'
      - 'scripts/install_cangjie_sdk.py'
      - 'scripts/validate_html_site.py'
      - 'src/**'
      - 'docs/**'
      - 'cjpm.toml'
      - 'cjpm.lock'
      - 'vendor/**'
      - 'tests/fixtures/projects/html_reference/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  CJDOC_PYTHON: python
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  CANGJIE_SDK_URL: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b"
  CANGJIE_SDK_SHA256: "2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a"

jobs:
  build:
    name: Build showcase
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore Cangjie SDK
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cangjie-sdk-1.1.3
          key: cangjie-sdk-linux-x64-2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a-v3-authenticated-archive

      - name: Install checksum-pinned Cangjie SDK
        id: sdk
        shell: bash
        run: |
          python scripts/install_cangjie_sdk.py \
            --url "${CANGJIE_SDK_URL}" \
            --sha256 "${CANGJIE_SDK_SHA256}" \
            --destination "${RUNNER_TEMP}/cangjie-sdk-1.1.3" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build cjdoc
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          cjc -v
          cjpm -v
          cjpm build

      - name: Build showcase site
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
          SHOWCASE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          SHOWCASE_REVISION: ${{ github.sha }}
        run: |
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          python scripts/build_showcase.py \
            --binary target/release/bin/main \
            --output target/showcase-site \
            --repository-url "${SHOWCASE_REPOSITORY_URL}" \
            --revision "${SHOWCASE_REVISION}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/showcase-site

  deploy:
    name: Publish showcase
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
