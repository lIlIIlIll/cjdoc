name: Deploy showcase

on:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/build-linux-candidate.yml'
      - 'site/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/showcase_contract/**'
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'cjpm.toml'
      - 'cjdoc.toml'
      - 'tools/**'
      - 'cjpm.lock'
      - 'vendor/**'
      - 'tests/fixtures/projects/html_reference/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/build-linux-candidate.yml'
      - 'site/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/showcase_contract/**'
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'cjpm.toml'
      - 'cjdoc.toml'
      - 'tools/**'
      - 'cjpm.lock'
      - 'vendor/**'
      - 'tests/fixtures/projects/html_reference/**'
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: CI run whose Linux candidate to reuse (empty = local build)
        type: string
        default: ""
      candidate_run_attempt:
        description: Attempt number of the reused CI run
        type: string
        default: "1"

permissions:
  contents: read
  # Reusing a CI candidate downloads an artifact from another workflow run, which
  # requires `actions: read`. Without it the reuse job fails after the resolver has
  # already committed to reuse, and no local fallback remains.
  actions: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CJDOC_PYTHON: python
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  cjHeapSize: "512MB"
  # Pinned by Zxilly/setup-cangjie, which resolves and checksum-verifies the
  # archive through the signed cangjie-version-manifest.
  CANGJIE_SDK_VERSION: "1.2.0"

jobs:
  # Build the Linux candidate through the same reusable workflow CI uses, so the
  # toolchain, the stdx sidecar and the -O1 workaround have one definition. The
  # candidate carries an identity manifest that every consumer re-verifies.
  # Decide whether this run may reuse a CI-produced candidate. Reuse requires
  # the same commit AND tree, an explicit run/attempt, or exactly one successful
  # CI run for this commit; anything ambiguous rebuilds locally. Pull requests
  # always build locally so a fork cannot influence a published site.
  resolve-candidate:
    name: Resolve Linux candidate source
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      run_attempt: ${{ steps.resolve.outputs.run_attempt }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      candidate_source: ${{ steps.resolve.outputs.candidate_source }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Decide the candidate source
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLICIT_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPLICIT_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD^{tree})"
          local_build() {
            {
              echo "reuse=false"
              echo "candidate_source=local-build"
              echo "artifact_name="
              echo "run_id="
              echo "run_attempt=1"
            } >> "${GITHUB_OUTPUT}"
            echo "candidateSource=local-build ($1)"
          }
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            local_build "pull requests never reuse a cross-run artifact"
            exit 0
          fi
          attempt=1
          run_id=""
          if [[ -n "${EXPLICIT_RUN_ID}" ]]; then
            run_id="${EXPLICIT_RUN_ID}"
            attempt="${EXPLICIT_RUN_ATTEMPT:-1}"
          else
            # Only a single unambiguous successful run for this exact commit may
            # be adopted; several candidates means the choice is not tractable.
            mapfile -t candidates < <(gh run list --workflow ci.yml --commit "${GITHUB_SHA}" \
              --status success --limit 20 --json databaseId,headSha --jq '.[].databaseId')
            if [[ ${#candidates[@]} -ne 1 ]]; then
              local_build "expected exactly one successful CI run, found ${#candidates[@]}"
              exit 0
            fi
            run_id="${candidates[0]}"
          fi
          artifact="cjdoc-linux-candidate-${run_id}-${attempt}"
          # Bind the decision to the exact commit and tree the artifact claims.
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '.head_sha' > "${RUNNER_TEMP}/head-sha" 2>/dev/null; then
            local_build "cannot read run ${run_id}"
            exit 0
          fi
          if [[ "$(cat "${RUNNER_TEMP}/head-sha")" != "${GITHUB_SHA}" ]]; then
            local_build "run ${run_id} is for another commit"
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact}" \
              --jq ".artifacts[] | select(.expired == false) | .id" \
              > "${RUNNER_TEMP}/artifact-id" 2>/dev/null || [[ ! -s "${RUNNER_TEMP}/artifact-id" ]]; then
            local_build "run ${run_id} attempt ${attempt} has no live ${artifact}"
            exit 0
          fi
          {
            echo "reuse=true"
            echo "candidate_source=ci-artifact"
            echo "artifact_name=${artifact}"
            echo "run_id=${run_id}"
            echo "run_attempt=${attempt}"
          } >> "${GITHUB_OUTPUT}"
          echo "candidateSource=ci-artifact run=${run_id} attempt=${attempt} tree=${tree}"

  # Local fallback: the reusable workflow remains the single definition of the
  # toolchain and the -O1 workaround even when no candidate can be reused.
  local-candidate:
    name: Build Linux candidate locally
    needs: resolve-candidate
    if: ${{ needs.resolve-candidate.outputs.reuse != 'true' }}
    uses: ./.github/workflows/build-linux-candidate.yml
    with:
      cangjie_sdk_version: "1.2.0"

  # Adopted CI candidate: download the exact named artifact and re-verify the
  # identity manifest against the checked-out commit and tree.
  reuse-candidate:
    name: Reuse the CI Linux candidate
    needs: resolve-candidate
    if: ${{ needs.resolve-candidate.outputs.reuse == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the named candidate artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ needs.resolve-candidate.outputs.artifact_name }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-candidate.outputs.run_id }}
          path: ${{ runner.temp }}/candidate

      - name: Re-verify the reused candidate identity
        shell: bash
        run: |
          set -euo pipefail
          tar -C . -xf "${RUNNER_TEMP}/candidate/cjdoc-linux-candidate.tar"
          chmod +x target/release/bin/main
          # This job only re-checks and republishes the artifact, so it does not
          # install the Cangjie runtime. The digest binds the bytes; the runnable
          # version check happens in the job that actually executes the binary.
          python scripts/ci_stage.py verify-identity --skip-version-check \
            --manifest target/ci-build/build-manifest.json \
            --main-binary target/release/bin/main --repo .

      - name: Upload the reused candidate as this run's candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-linux-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/cjdoc-linux-candidate.tar
          retention-days: 7
          if-no-files-found: error

  # Generate the final site exactly once and seal it. Every branch below reads
  # this one artifact and can never regenerate or mutate it.
  assemble-site:
    name: Assemble final site
    needs: [resolve-candidate, local-candidate, reuse-candidate]
    if: ${{ always() && !cancelled() && (needs.local-candidate.result == 'success' || needs.reuse-candidate.result == 'success') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-showcase.txt

      - name: Restore cjv toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/setup-cangjie-cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CANGJIE_SDK_VERSION }}-sts-stdx-cjv0.3.2-${{ hashFiles('.github/workflows/build-linux-candidate.yml', '.github/workflows/ci.yml', '.github/workflows/pages.yml', '.github/workflows/daily.yml') }}

      - name: Set up Cangjie STS SDK with stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: ${{ env.CANGJIE_SDK_VERSION }}
          components: stdx
          cjv-version: v0.3.2

      - name: Export authenticated stdx environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/with_stdx.py --variant static --print-env -- | tee -a "${GITHUB_ENV}"

      - name: Download this run's candidate
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          # Both candidate paths republish under this run's own name, so the
          # consumer always reads one unambiguous artifact of this run.
          name: cjdoc-linux-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate

      - name: Record the candidate source
        shell: bash
        env:
          CJDOC_CI_EVIDENCE: ${{ runner.temp }}/ci-evidence
        run: |
          set -euo pipefail
          python scripts/ci_stage.py run --id candidate-source --kind build \
            --evidence "${CJDOC_CI_EVIDENCE}" \
            --extra '{"reuse":{"candidateSource":"${{ needs.resolve-candidate.outputs.candidate_source }}","runId":"${{ needs.resolve-candidate.outputs.run_id }}","artifactName":"${{ needs.resolve-candidate.outputs.artifact_name }}"}}' \
            -- bash -c 'echo "candidate source: $0" ' "${{ needs.resolve-candidate.outputs.candidate_source }}"

      - name: Unpack and re-verify the candidate identity
        shell: bash
        run: |
          set -euo pipefail
          tar -C . -xf "${RUNNER_TEMP}/candidate/cjdoc-linux-candidate.tar"
          chmod +x target/release/bin/main
          # This job only needs the bytes to generate the site, so it does not
          # install the Cangjie runtime and cannot execute the dynamically linked
          # binary. The digest and size still bind the artifact; the runnable
          # version check happens in the CI acceptance stages.
          python scripts/ci_stage.py verify-identity --skip-version-check \
            --manifest target/ci-build/build-manifest.json \
            --main-binary target/release/bin/main --repo .

      - name: Assemble the final site once
        shell: bash
        env:
          SHOWCASE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          SHOWCASE_REVISION: ${{ github.sha }}
          CJDOC_CI_EVIDENCE: ${{ runner.temp }}/ci-evidence
        run: |
          set -euo pipefail
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          python scripts/ci_stage.py run --id site-assemble --kind site-assemble \
            --evidence "${CJDOC_CI_EVIDENCE}" -- \
            python scripts/build_showcase.py \
              --binary target/release/bin/main \
              --output target/showcase-site \
              --repository-url "${SHOWCASE_REPOSITORY_URL}" \
              --revision "${SHOWCASE_REVISION}"

      - name: Fingerprint the sealed site
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python -m showcase_contract fingerprint --site target/showcase-site \
            > target/showcase-site.sha256
          cat target/showcase-site.sha256

      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-timing-pages-assemble-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence/
          retention-days: 7
          if-no-files-found: error

      - name: Upload the sealed site with its generating binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-site-${{ github.run_id }}-${{ github.run_attempt }}
          # The published tree contains hidden files such as .nojekyll. Artifact
          # upload drops them by default, which would change the tree digest that
          # showcase-site.sha256 seals, so they must be included.
          include-hidden-files: true
          # One anchored root, so consumers see a stable, unambiguous layout:
          # showcase-site/, showcase-site.sha256/, ci-build/, release/bin/main.
          path: |
            target/showcase-site
            target/showcase-site.sha256
            target/ci-build
            target/release/bin/main
          retention-days: 7
          if-no-files-found: error

  # Reproduce the published source archive with the exact generating binary.
  source-reproduction:
    name: Reproduce the downloaded source bundle
    needs: assemble-site
    if: ${{ !cancelled() && needs.assemble-site.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore cjv toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/setup-cangjie-cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CANGJIE_SDK_VERSION }}-sts-stdx-cjv0.3.2-${{ hashFiles('.github/workflows/build-linux-candidate.yml', '.github/workflows/ci.yml', '.github/workflows/pages.yml', '.github/workflows/daily.yml') }}

      - name: Set up Cangjie STS SDK with stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: ${{ env.CANGJIE_SDK_VERSION }}
          components: stdx
          cjv-version: v0.3.2

      - name: Export authenticated stdx environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/with_stdx.py --variant static --print-env -- | tee -a "${GITHUB_ENV}"

      - name: Download the sealed site
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cjdoc-showcase-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed

      - name: Reproduce the source bundle
        shell: bash
        env:
          CJDOC_CI_EVIDENCE: ${{ runner.temp }}/ci-evidence
        run: |
          set -euo pipefail
          sealed="${RUNNER_TEMP}/sealed"
          chmod +x "${sealed}/release/bin/main"
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          python scripts/ci_stage.py verify-identity \
            --manifest "${sealed}/ci-build/build-manifest.json" \
            --main-binary "${sealed}/release/bin/main"
          mkdir -p target
          python scripts/ci_stage.py run --id source-reproduction --kind source-reproduction \
            --evidence "${CJDOC_CI_EVIDENCE}" -- \
            python scripts/check_showcase_source.py \
              --site "${sealed}/showcase-site" \
              --binary "${sealed}/release/bin/main" \
              --evidence target/showcase-source-evidence.json \
              --expect-site-sha256 "$(cat "${sealed}/showcase-site.sha256")"

      - name: Upload source reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/showcase-source-evidence.json
            target/showcase-source-evidence.log
          retention-days: 7
          if-no-files-found: error

  # Two independent browser shards. Homepage groups stay whole, so each shard
  # observes exactly the same per-group state a single-process run would.
  browser-shard:
    name: Browser shard ${{ matrix.shard }}
    needs: assemble-site
    if: ${{ !cancelled() && needs.assemble-site.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-showcase.txt

      - name: Restore Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Playwright's default per-user cache; keyed by its exact pin.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements-showcase.txt') }}

      - name: Restore CJK fonts
        id: font-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/noto-cjk-fonts
          key: noto-cjk-fonts-${{ runner.os }}-1.20220127-v1

      - name: Install browser acceptance dependencies
        env:
          CACHE_HIT_FONTS: ${{ steps.font-cache.outputs.cache-hit }}
        run: |
          python -m pip install --disable-pip-version-check psutil -r scripts/requirements-showcase.txt
          python -m playwright install --with-deps chromium
          # Chromium cannot rasterize CJK text without a fallback font, so the
          # evidence screenshots depend on this package being present. The
          # 61 MB archive is slow to fetch on a cold runner, so cache the four
          # installed collections instead of the whole fontconfig database.
          if [ "${CACHE_HIT_FONTS}" != "true" ]; then
            sudo apt-get install -y fonts-noto-cjk
            mkdir -p "${RUNNER_TEMP}/noto-cjk-fonts"
            sudo cp /usr/share/fonts/opentype/noto/Noto*CJK-*.ttc "${RUNNER_TEMP}/noto-cjk-fonts/"
            # The cache action archives as the runner user, so hand it the files.
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/noto-cjk-fonts"
          else
            sudo mkdir -p /usr/share/fonts/opentype/noto
            sudo cp "${RUNNER_TEMP}"/noto-cjk-fonts/Noto*CJK-*.ttc /usr/share/fonts/opentype/noto/
            sudo fc-cache -f >/dev/null
          fi
          test -s /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

      - name: Download the sealed site
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cjdoc-showcase-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed

      - name: Plan and run the browser shard
        shell: bash
        env:
          PYTHONPATH: scripts
          CJDOC_CI_EVIDENCE: ${{ runner.temp }}/ci-evidence
        run: |
          set -euo pipefail
          sealed="${RUNNER_TEMP}/sealed"
          python -m showcase_contract.browser plan \
            --site "${sealed}/showcase-site" --shards 2 \
            --run-id "${GITHUB_RUN_ID}" --output target/browser-plan.json
          python scripts/ci_stage.py run --id "browser-shard-${{ matrix.shard }}" --kind browser-shard \
            --evidence "${CJDOC_CI_EVIDENCE}" -- \
            python -m showcase_contract.browser run \
              --site "${sealed}/showcase-site" --plan target/browser-plan.json \
              --shard-index "${{ matrix.shard }}" --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --evidence "target/browser-shard-${{ matrix.shard }}"

      - name: Upload the shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-browser-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/browser-plan.json
            target/browser-shard-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: error

  reading-regressions:
    name: Check API reading regressions
    needs: assemble-site
    if: ${{ !cancelled() && needs.assemble-site.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-showcase.txt

      - name: Restore Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements-showcase.txt') }}

      - name: Install browser acceptance dependencies
        run: |
          python -m pip install --disable-pip-version-check psutil -r scripts/requirements-showcase.txt
          python -m playwright install --with-deps chromium

      - name: Download the sealed site
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cjdoc-showcase-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed

      - name: Check reading regressions against the sealed site
        shell: bash
        env:
          PYTHONPATH: scripts
          CJDOC_CI_EVIDENCE: ${{ runner.temp }}/ci-evidence
        run: |
          set -euo pipefail
          sealed="${RUNNER_TEMP}/sealed"
          python scripts/ci_stage.py run --id reading-regressions --kind reading \
            --evidence "${CJDOC_CI_EVIDENCE}" -- \
            python -m showcase_contract.browser_reading_regressions \
              --site "${sealed}/showcase-site" \
              --evidence target/showcase-reading-evidence \
              --expect-site-sha256 "$(cat "${sealed}/showcase-site.sha256")"

      - name: Upload reading evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-reading-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/showcase-reading-evidence
          retention-days: 7
          if-no-files-found: error

  # Fan-in gate: every branch must have produced evidence bound to the same
  # sealed site, and the merged browser evidence must pass the unmodified
  # full-coverage gate before anything is published.
  verify-site:
    name: Verify the final site and every branch
    needs: [assemble-site, source-reproduction, browser-shard, reading-regressions]
    if: ${{ !cancelled()
           && needs.assemble-site.result == 'success'
           && needs.source-reproduction.result == 'success'
           && needs.browser-shard.result == 'success'
           && needs.reading-regressions.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the sealed site
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cjdoc-showcase-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed

      - name: Download both browser shards
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          # Pinned to this run and attempt: a rerun keeps earlier attempts'
          # artifacts, whose names differ only by that suffix, and merging them
          # would mix stale shard evidence into the deployment gate.
          pattern: cjdoc-showcase-browser-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/branches
          merge-multiple: true

      - name: Download source reproduction evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cjdoc-showcase-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/branches/source

      - name: Download reading evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cjdoc-showcase-reading-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/branches/reading

      - name: Require every branch artifact and bind it to the sealed site
        shell: bash
        run: |
          set -euo pipefail
          sealed="${RUNNER_TEMP}/sealed"
          branches="${RUNNER_TEMP}/branches"
          test -f "${sealed}/showcase-site.sha256"
          test -f "${branches}/browser-plan.json"
          for file in "${branches}/browser-shard-0/shard.json" \
                      "${branches}/browser-shard-1/shard.json" \
                      "${branches}/source/showcase-source-evidence.json" \
                      "${branches}/reading/results.json"; do
            test -f "${file}"
          done
          python scripts/showcase_branch_receipts.py \
            --site "${sealed}/showcase-site" \
            --site-sha256 "$(cat "${sealed}/showcase-site.sha256")" \
            --build-manifest "${sealed}/ci-build/build-manifest.json" \
            --source-evidence "${branches}/source/showcase-source-evidence.json" \
            --reading-evidence "${branches}/reading/results.json" \
            --receipt "${branches}/branch-receipt.json"

      - name: Merge shards and run the unmodified full evidence gate
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          sealed="${RUNNER_TEMP}/sealed"
          branches="${RUNNER_TEMP}/branches"
          python -m showcase_contract.browser merge \
            --site "${sealed}/showcase-site" \
            --plan "${branches}/browser-plan.json" \
            --shard-result "0=${branches}/browser-shard-0/shard.json" \
            --shard-result "1=${branches}/browser-shard-1/shard.json" \
            --evidence target/showcase-evidence \
            --receipt "${branches}/browser-merge-receipt.json"
          python -m showcase_contract verify \
            --site "${sealed}/showcase-site" \
            --evidence target/showcase-evidence/results.json \
            --baseline site/showcase-baseline.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/showcase-evidence
            ${{ runner.temp }}/branches
          retention-days: 30
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/sealed/showcase-site

      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed/showcase-site
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Publish showcase
    if: ${{ !cancelled() && github.event_name != 'pull_request'
           && needs.verify-site.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    needs: verify-site
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
