name: Deploy showcase

on:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/showcase_contract/**'
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'cjpm.toml'
      - 'cjdoc.toml'
      - 'tools/**'
      - 'cjpm.lock'
      - 'vendor/**'
      - 'tests/fixtures/projects/html_reference/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/showcase_contract/**'
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'cjpm.toml'
      - 'cjdoc.toml'
      - 'tools/**'
      - 'cjpm.lock'
      - 'vendor/**'
      - 'tests/fixtures/projects/html_reference/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CJDOC_PYTHON: python
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  cjHeapSize: "512MB"
  # Pinned by Zxilly/setup-cangjie, which resolves and checksum-verifies the
  # archive through the signed cangjie-version-manifest.
  CANGJIE_SDK_VERSION: "1.2.0"

jobs:
  build:
    name: Build showcase
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-showcase.txt

      - name: Verify tracked repository inputs
        run: python scripts/verify_repository_inputs.py --require-tracked

      - name: Preserve exact tracked source inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/showcase-inputs
          git archive --format=tar.gz --output=target/showcase-inputs/source.tar.gz HEAD
          git rev-parse HEAD > target/showcase-inputs/revision.txt
          sha256sum target/showcase-inputs/source.tar.gz > target/showcase-inputs/SHA256SUMS

      - name: Upload reproducible source inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/showcase-inputs/
          retention-days: 7
          if-no-files-found: error

      - name: Test showcase contracts
        run: python -m unittest discover -s tests/showcase_contract -v

      - name: Restore cjv toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # setup-cangjie keeps its toolchains in CJV_HOME under RUNNER_TEMP.
          # A warm hit makes `cjv install` a no-op instead of a fresh download.
          path: ${{ runner.temp }}/setup-cangjie-cjv
          key: cjv-home-${{ runner.os }}-${{ env.CANGJIE_SDK_VERSION }}-v1

      - name: Set up Cangjie SDK 1.2.0 with stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: ${{ env.CANGJIE_SDK_VERSION }}
          components: stdx
          # Pinned so a future cjv release cannot change resolution silently.
          cjv-version: v0.3.2

      - name: Restore Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Playwright's default per-user cache; keyed by its exact pin.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements-showcase.txt') }}

      - name: Restore CJK fonts
        id: font-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/noto-cjk-fonts
          key: noto-cjk-fonts-${{ runner.os }}-1.20220127-v1

      - name: Install browser acceptance dependencies
        run: |
          python -m pip install --disable-pip-version-check psutil -r scripts/requirements-showcase.txt
          python -m playwright install --with-deps chromium
          # Chromium cannot rasterize CJK text without a fallback font, so the
          # evidence screenshots depend on this package being present. The
          # 61 MB archive is slow to fetch on a cold runner, so cache the four
          # installed collections instead of the whole fontconfig database.
          if [ "${CACHE_HIT_FONTS}" != "true" ]; then
            sudo apt-get install -y fonts-noto-cjk
            mkdir -p "${RUNNER_TEMP}/noto-cjk-fonts"
            sudo cp /usr/share/fonts/opentype/noto/Noto*CJK-*.ttc "${RUNNER_TEMP}/noto-cjk-fonts/"
            # The cache action archives as the runner user, so hand it the files.
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/noto-cjk-fonts"
          else
            sudo mkdir -p /usr/share/fonts/opentype/noto
            sudo cp "${RUNNER_TEMP}"/noto-cjk-fonts/Noto*CJK-*.ttc /usr/share/fonts/opentype/noto/
            sudo fc-cache -f >/dev/null
          fi
          test -s /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        env:
          CACHE_HIT_FONTS: ${{ steps.font-cache.outputs.cache-hit }}

      - name: Export authenticated stdx environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/with_stdx.py --variant static --print-env -- | tee -a "${GITHUB_ENV}"

      - name: Build cjdoc
        shell: bash
        run: |
          set -euo pipefail
          cjc -v
          cjpm -v
          # STS 1.2.0's llc crashes at -O2 on markdown/yjson; use the CI -O1 workaround.
          python scripts/with_stdx.py --variant static -- python - <<'PYTHON'
          from pathlib import Path
          import subprocess

          manifest = Path("cjpm.toml")
          contents = manifest.read_bytes()
          needle = b'override-compile-option = ""'
          if contents.count(needle) != 1:
              raise SystemExit("expected one default compile override in cjpm.toml")
          try:
              manifest.write_bytes(contents.replace(needle, b'override-compile-option = "-O1"', 1))
              subprocess.run(["cjpm", "build", "--jobs", "1"], check=True)
          finally:
              manifest.write_bytes(contents)
          PYTHON

      - name: Build showcase site
        shell: bash
        env:
          SHOWCASE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          SHOWCASE_REVISION: ${{ github.sha }}
        run: |
          python scripts/build_showcase.py \
            --binary target/release/bin/main \
            --output target/showcase-site \
            --repository-url "${SHOWCASE_REPOSITORY_URL}" \
            --revision "${SHOWCASE_REVISION}"

      - name: Reproduce downloaded source bundle with native cjdoc
        shell: bash
        run: |
          python scripts/check_showcase_source.py \
            --site target/showcase-site \
            --binary target/release/bin/main \
            --evidence target/showcase-source-evidence.json

      - name: Run browser acceptance against the final site
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          python -m showcase_contract.browser \
            --site target/showcase-site \
            --evidence target/showcase-evidence

      - name: Verify final site and browser evidence before publishing
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          python -m showcase_contract verify \
            --site target/showcase-site \
            --evidence target/showcase-evidence/results.json \
            --baseline site/showcase-baseline.json

      - name: Check API reading regressions against the final site
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          python -m showcase_contract.browser_reading_regressions \
            --site target/showcase-site \
            --evidence target/showcase-reading-evidence

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/showcase-evidence/
            target/showcase-reading-evidence/
            target/showcase-source-evidence.json
            target/showcase-source-evidence.log
            target/showcase-site/artifacts/showcase-stage-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/showcase-site

      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/showcase-site
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Publish showcase
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
