name: Pages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "site/**"
      - "examples/**"
      - "scripts/**"
      - "tests/showcase_contract/**"
      - "src/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: 1.1.3
  SDK_URL: https://github.com/SunriseSummer/CangjieSDK/releases/download/1.1.3/cangjie-sdk-linux-x64-1.1.3.tar.gz
  SDK_SHA256: 05bffd793681eea8c32da7acbc491a0b1ccd915086626251fed862778dc0552f28ab

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked files for sensitive data
        shell: bash
        run: |
          set -euo pipefail
          version=8.21.2
          curl --fail --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --exit-code 1
      - name: Preserve exact tracked source inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/showcase-inputs
          git archive --format=tar.gz --output=target/showcase-inputs/source.tar.gz HEAD
          git rev-parse HEAD > target/showcase-inputs/revision.txt
          sha256sum target/showcase-inputs/source.tar.gz > target/showcase-inputs/SHA256SUMS
      - name: Upload reproducible source inputs
        uses: actions/upload-artifact@v4
        with:
          name: cjdoc-showcase-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/showcase-inputs/
          retention-days: 7
          if-no-files-found: error
      - name: Test showcase contracts
        run: python3 -m unittest discover -s tests/showcase_contract -v
      - name: Cache Cangjie SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: cangjie
          key: cangjie-sdk-${{ runner.os }}-x64-${{ env.SDK_VERSION }}-${{ env.SDK_SHA256 }}-no-symlinks-v2
      - name: Install Cangjie SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: python3 scripts/install_cangjie_sdk.py --url "$SDK_URL" --sha256 "$SDK_SHA256" --dest cangjie
      - name: Install project dependencies
        shell: bash
        run: |
          source cangjie/envsetup.sh
          cjpm update
      - name: Build binary
        shell: bash
        run: |
          source cangjie/envsetup.sh
          cjpm build
      - name: Build static showcase
        shell: bash
        run: |
          source cangjie/envsetup.sh
          python3 scripts/build_showcase.py --root . --binary target/release/bin/main --output target/site --repository "$GITHUB_REPOSITORY"
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cjdoc-pages-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/site/artifacts/showcase-stage-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site
      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cjdoc-pages-preview-pr-${{ github.event.pull_request.number }}
          path: target/site
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
