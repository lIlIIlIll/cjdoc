name: Deploy showcase

on:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/showcase_contract/**'
      - 'src/**'
      - 'docs/**'
      - 'cjpm.toml'
      - 'cjpm.lock'
      - 'vendor/**'
      - 'tests/fixtures/projects/html_reference/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/showcase_contract/**'
      - 'src/**'
      - 'docs/**'
      - 'cjpm.toml'
      - 'cjpm.lock'
      - 'vendor/**'
      - 'tests/fixtures/projects/html_reference/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CJDOC_PYTHON: python
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  cjHeapSize: "512MB"
  CANGJIE_SDK_URL: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b"
  CANGJIE_SDK_SHA256: "2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a"

jobs:
  build:
    name: Build showcase
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Preserve exact tracked source inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/showcase-inputs
          git archive --format=tar.gz --output=target/showcase-inputs/source.tar.gz HEAD
          git rev-parse HEAD > target/showcase-inputs/revision.txt
          sha256sum target/showcase-inputs/source.tar.gz > target/showcase-inputs/SHA256SUMS

      - name: Upload reproducible source inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/showcase-inputs/
          retention-days: 7
          if-no-files-found: error

      - name: Test showcase contracts
        run: python -m unittest discover -s tests/showcase_contract -v

      - name: Restore Cangjie SDK
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cangjie-sdk-1.1.3
          key: cangjie-sdk-linux-x64-2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a-v3-authenticated-archive

      - name: Install checksum-pinned Cangjie SDK
        id: sdk
        shell: bash
        run: |
          python scripts/install_cangjie_sdk.py \
            --url "${CANGJIE_SDK_URL}" \
            --sha256 "${CANGJIE_SDK_SHA256}" \
            --destination "${RUNNER_TEMP}/cangjie-sdk-1.1.3" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build cjdoc
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          cjc -v
          cjpm -v
          cjpm build

      - name: Build showcase site
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
          SHOWCASE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          SHOWCASE_REVISION: ${{ github.sha }}
        run: |
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          python scripts/build_showcase.py \
            --binary target/release/bin/main \
            --output target/showcase-site \
            --repository-url "${SHOWCASE_REPOSITORY_URL}" \
            --revision "${SHOWCASE_REVISION}"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/showcase-evidence/
            target/showcase-site/artifacts/showcase-stage-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/showcase-site

      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cjdoc-showcase-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/showcase-site
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Publish showcase
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
