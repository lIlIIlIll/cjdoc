name: Temporary Cangjie lexer probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/signature-lexer-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Set up Cangjie 1.2.0 STS
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: "1.2.0"
          cjv-version: v0.3.2
      - name: Lex exact join signature
        shell: bash
        run: |
          set -euo pipefail
          cjc -v
          cat > /tmp/join-lexer-probe.cj <<'CJ'
          import std.ast.*

          main(): Unit {
              let signatures: Array<String> = [
                  "public func join(separator!: String = \",\"): String",
                  "public func join(separator!: String): String",
                  "public func join(separator!: String = \"hello\"): String"
              ]
              for (signature in signatures) {
                  println("SOURCE=[" + signature + "]")
                  let tokens = cangjieLex(signature)
                  println("TOKENS=" + tokens.size.toString())
                  for (token in tokens) {
                      if (token.kind == COMMENT || token.kind == NL || token.value.isEmpty()) {
                          continue
                      }
                      println("KIND=[" + token.kind.toString() +
                          "] VALUE=[" + token.value +
                          "] BYTES=" + token.value.size.toString() +
                          " POSITION=" + token.pos.line.toString() +
                          ":" + token.pos.column.toString())
                  }
              }
          }
          CJ
          cjc /tmp/join-lexer-probe.cj -o /tmp/join-lexer-probe
          /tmp/join-lexer-probe
