name: Reader scale observations

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/render/**'
      - 'scripts/reader_*.py'
      - 'scripts/test_reader_benchmark.py'
      - 'tests/browser/*reader-scale*.mjs'
      - 'tests/browser/check-reader-discovery.mjs'
      - 'docs/maintainer/reader-scale*'
      - 'docs/contract-review.md'
      - 'examples/pocketkit/**'
      - '.github/workflows/reader-scale.yml'
  push:
    branches: [main]
    paths:
      - 'src/render/**'
      - 'scripts/reader_*.py'
      - 'tests/browser/*reader-scale*.mjs'
      - 'tests/browser/check-reader-discovery.mjs'
      - 'examples/pocketkit/**'
      - '.github/workflows/reader-scale.yml'
  workflow_dispatch:
    inputs:
      corpus:
        description: 'Fixed cohort; resource-limited is an observation, never a supported-scale PASS'
        type: choice
        options: ['1000', '10000', '50000', 'external']
        default: '1000'

permissions:
  contents: read

concurrency:
  group: reader-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    uses: ./.github/workflows/build-linux-candidate.yml
    with:
      cangjie_sdk_version: '1.2.0'

  observe:
    name: Capture native reader observations
    needs: candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CJDOC_PYTHON: python
      cjHeapSize: '512MB'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Prepare disk-backed task directories
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(stat -f -c %T "${RUNNER_TEMP}")" == tmpfs ]]; then
            echo 'Reader evidence requires disk-backed runner temporary storage' >&2
            exit 1
          fi
          python3 -c 'import os,shutil; print("Reader available disk bytes:", shutil.disk_usage(os.environ["RUNNER_TEMP"]).free)'
          install -d -m 0700 "${RUNNER_TEMP}/reader-tmp" \
            "${RUNNER_TEMP}/reader-browser-dependencies" "${RUNNER_TEMP}/reader-browsers"
          printf '%s=%s\n' \
            PLAYWRIGHT_BROWSERS_PATH "${RUNNER_TEMP}/reader-browsers" \
            CJDOC_BROWSER_REQUIRE_ROOT "${RUNNER_TEMP}/reader-browser-dependencies" \
            TMPDIR "${RUNNER_TEMP}/reader-tmp" \
            TMP "${RUNNER_TEMP}/reader-tmp" \
            TEMP "${RUNNER_TEMP}/reader-tmp" >> "${GITHUB_ENV}"

      - name: Check out measurement source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up locked browser runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false

      - name: Install authenticated STS and sibling stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: '1.2.0'
          components: stdx
          cjv-version: v0.3.2

      - name: Export authenticated stdx metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/with_stdx.py --variant static --print-env -- >> "${GITHUB_ENV}"

      - name: Download source-bound native candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/reader-candidate

      - name: Provision fonts and the exact browser dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cp tests/browser/package.json tests/browser/package-lock.json "${CJDOC_BROWSER_REQUIRE_ROOT}/"
          npm ci --prefix "${CJDOC_BROWSER_REQUIRE_ROOT}" --no-audit --no-fund
          "${CJDOC_BROWSER_REQUIRE_ROOT}/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Check out the immutable pre-change generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '2ef643c5d795ab2e3dfd1035517baeec3a88b0aa'
          path: reader-scale-baseline-source
          persist-credentials: false

      - name: Build baseline outside the measured source tree
        shell: bash
        run: |
          set -euo pipefail
          baseline="${RUNNER_TEMP}/reader-baseline-source"
          mv reader-scale-baseline-source "${baseline}"
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          . scripts/with_sts_cjpm.sh
          GITHUB_WORKSPACE="${baseline}" bash "${baseline}/scripts/check.sh" build \
            --repo "${baseline}" \
            --main-binary-out "${baseline}/target/release/bin/main" \
            --worker-binary-out "${baseline}/target/release/bin/chir-worker-main" \
            --manifest "${baseline}/target/ci-build/build-manifest.json"

      - name: Capture fixed native and browser observations
        shell: bash
        env:
          READER_CORPUS: ${{ inputs.corpus || '1000' }}
          READER_REVISION: ${{ github.sha }}
          EXPECTED_BINARY_SHA256: ${{ needs.candidate.outputs.main_binary_sha256 }}
        run: |
          set -euo pipefail
          ulimit -c 0
          tar -C . -xf "${RUNNER_TEMP}/reader-candidate/cjdoc-linux-candidate.tar"
          printf '%s  %s\n' "${EXPECTED_BINARY_SHA256}" target/release/bin/main | sha256sum --check -
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          . scripts/with_sts_cjpm.sh
          export CJDOC_READER_TEST_BINARY="${PWD}/target/release/bin/main"
          export CJDOC_READER_TEST_REVISION="${READER_REVISION}"
          python scripts/with_stdx.py --variant static -- python -m unittest discover \
            -s scripts -p test_reader_benchmark.py -v
          install -d -m 0700 "${RUNNER_TEMP}/reader-evidence"
          python scripts/with_stdx.py --variant static -- python scripts/reader_contract_review.py \
            --revision "${READER_REVISION}" --output "${RUNNER_TEMP}/reader-evidence/contracts"
          python scripts/with_stdx.py --variant static -- python scripts/reader_capture.py \
            --binary "${RUNNER_TEMP}/reader-baseline-source/target/release/bin/main" \
            --revision 2ef643c5d795ab2e3dfd1035517baeec3a88b0aa --label baseline \
            --corpus "${READER_CORPUS}" --output "${RUNNER_TEMP}/reader-evidence/baseline"
          presentation=()
          if [[ "${READER_CORPUS}" == 1000 ]]; then
            presentation=(--presentation docs/maintainer/reader-scale-presentation.json)
          fi
          python scripts/reader_register.py "${presentation[@]}" \
            --baseline "${RUNNER_TEMP}/reader-evidence/baseline/observation" \
            --template docs/maintainer/reader-scale-budgets.json \
            --output "${RUNNER_TEMP}/reader-evidence/registered.json"
          python scripts/with_stdx.py --variant static -- python scripts/reader_capture.py \
            --binary target/release/bin/main --revision "${READER_REVISION}" --label after \
            --corpus "${READER_CORPUS}" --output "${RUNNER_TEMP}/reader-evidence/after"
          if [[ "${READER_CORPUS}" == 1000 ]]; then
            for locale in en zh-CN; do
              node tests/browser/check-reader-discovery.mjs \
                --site "${RUNNER_TEMP}/reader-evidence/after/observation/locale-${locale}/html" \
                --locale "${locale}" --output "${RUNNER_TEMP}/reader-evidence/discovery-${locale}"
            done
          fi
          python scripts/reader_compare.py \
            --baseline "${RUNNER_TEMP}/reader-evidence/baseline/observation" \
            --after "${RUNNER_TEMP}/reader-evidence/after/observation" \
            --manifest "${RUNNER_TEMP}/reader-evidence/baseline/corpus/reader-corpus.json" \
            --budgets "${RUNNER_TEMP}/reader-evidence/registered.json" \
            --output "${RUNNER_TEMP}/reader-evidence/comparison.json"

      - name: Retain uncut measurements and actual generated-page screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-observations-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reader-evidence/**/*.json
            ${{ runner.temp }}/reader-evidence/**/*.log
            ${{ runner.temp }}/reader-evidence/**/*.png
          retention-days: 30
          if-no-files-found: warn
