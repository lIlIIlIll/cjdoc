name: Frozen fixture evidence (manual diagnostic only)

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        default: macos-host
        options:
          - macos-host
          - windows-provider
          - windows-root-main
          - macos-provider-main
  workflow_call:
    inputs:
      profile:
        type: string
        required: false
        default: macos-host

permissions:
  contents: read

jobs:
  host-build:
    runs-on: ${{ startsWith(inputs.profile, 'windows-') && 'windows-2022' || 'macos-15' }}
    timeout-minutes: ${{ contains(inputs.profile, 'provider') && 60 || 35 }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"
      DIAGNOSTIC_PROFILE: ${{ inputs.profile || 'macos-host' }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - name: Check out diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - name: Check out frozen product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8cc8f71a296b1c6321e575b56fadbd0c379e242a
          path: product
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up the original STS SDK with stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: "1.2.0"
          components: stdx
          cjv-version: v0.3.2
      - name: Run the original fixture command once
        shell: bash
        run: |
          set -euo pipefail
          python controller/scripts/highlight_host_diagnostic.py \
            --profile "$DIAGNOSTIC_PROFILE" \
            --source "$GITHUB_WORKSPACE/product" \
            --output "${RUNNER_TEMP}/highlight-host-diagnostic"
      - name: Upload reviewed diagnostic files only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-evidence-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/highlight-host-diagnostic/public/receipt.json
            ${{ runner.temp }}/highlight-host-diagnostic/public/build.sanitized.log
          if-no-files-found: warn
          retention-days: 3
