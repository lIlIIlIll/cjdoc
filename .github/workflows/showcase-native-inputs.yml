name: Showcase native validation inputs

on:
  pull_request:
    paths:
      - '.github/workflows/showcase-native-inputs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-inputs:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/cangjie-sdk-1.1.3
          key: cangjie-sdk-linux-x64-2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a-v3-authenticated-archive
      - name: Install verified SDK
        id: sdk
        run: |
          python scripts/install_cangjie_sdk.py \
            --url 'https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b' \
            --sha256 '2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a' \
            --destination "${RUNNER_TEMP}/cangjie-sdk-1.1.3" \
            --github-output "$GITHUB_OUTPUT"
      - name: Archive only the public pinned SDK and tracked source
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p target/native-inputs
          tar -czf target/native-inputs/sdk.tar.gz -C "$CANGJIE_SDK_ROOT" .
          git archive --format=tar.gz --output=target/native-inputs/source.tar.gz HEAD
          git rev-parse HEAD > target/native-inputs/revision.txt
          sha256sum target/native-inputs/*.tar.gz > target/native-inputs/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cjdoc-native-inputs-${{ github.run_id }}
          path: target/native-inputs/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
