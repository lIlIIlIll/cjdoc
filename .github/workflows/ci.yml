name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: ${{ matrix.platform }} / Cangjie 1.2.0 STS + stdx release/1.2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.2.0.tar.gz&objectKey=6ab1e26eece1f87ff5befa73"
            sdk_sha256: "8c5fd944cd9cc51ee63d4a240e3ecc4f540345dae1468e8b47c927ecf2ba998f"
          - platform: windows-x64
            runner: windows-2022
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-windows-x64-1.2.0.zip&objectKey=6ab1eafae4bd101f57762f5e"
            sdk_sha256: "7bd5088ad56fb03c1214e73ea076de5ac08580cc419a8cbd46a524ee1ca250bf"
          - platform: macos-arm64
            runner: macos-15
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-mac-aarch64-1.2.0.tar.gz&objectKey=6ab1e6451320215435b23d52"
            sdk_sha256: "de88d6ba2185c94979e0ab2fe8ac1d81535dfdff3fcb51fbba71e4b99d851f97"

    env:
      CJDOC_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Windows long paths
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: git config --global core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tracked repository inputs
        run: python scripts/verify_repository_inputs.py --require-tracked

      - name: Test SDK installer
        run: python -m unittest scripts/test_install_cangjie_sdk.py

      - name: Install stdx build Python dependency
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            python_command=python3
          else
            python_command=python
          fi
          "${python_command}" -m pip install --disable-pip-version-check psutil
          "${python_command}" -c 'import psutil'

      - name: Install Windows STS stdx OpenSSL dependency
        if: matrix.platform == 'windows-x64'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: mingw-w64-x86_64-openssl

      - name: Set Windows STS stdx OpenSSL search path
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $opensslRoot = Join-Path $env:MSYS2_LOCATION 'mingw64'
          "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$opensslRoot" >> $env:GITHUB_ENV

      - name: Add macOS LLVM archiver to PATH
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          llvm_ar="$(xcrun --find llvm-ar 2>/dev/null || true)"
          llvm_bin=""
          if [[ -n "${llvm_ar}" ]]; then
            llvm_bin="$(dirname "${llvm_ar}")"
          fi
          if [[ -z "${llvm_bin}" || ! -x "${llvm_bin}/llvm-ranlib" ]]; then
            brew install llvm
            llvm_bin="$(brew --prefix llvm)/bin"
          fi
          test -x "${llvm_bin}/llvm-ar"
          test -x "${llvm_bin}/llvm-ranlib"
          echo "${llvm_bin}" >> "${GITHUB_PATH}"

      - name: Restore Cangjie STS SDK
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cangjie-sdk-1.2.0
          key: cangjie-sdk-${{ matrix.platform }}-${{ matrix.sdk_sha256 }}-sts-1.2.0-v3

      - name: Install checksum-pinned Cangjie STS SDK
        id: sdk
        shell: bash
        env:
          CANGJIE_SDK_URL: ${{ matrix.sdk_url }}
          CANGJIE_SDK_SHA256: ${{ matrix.sdk_sha256 }}
        run: |
          set -euo pipefail
          test -n "${CANGJIE_SDK_URL}"
          [[ "${CANGJIE_SDK_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          python scripts/install_cangjie_sdk.py \
            --url "${CANGJIE_SDK_URL}" \
            --sha256 "${CANGJIE_SDK_SHA256}" \
            --destination "${RUNNER_TEMP}/cangjie-sdk-1.2.0" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build pinned STS stdx source
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
          CANGJIE_STDX_SOURCE_REV: "6d53814868de41bccf5b92b1d6ff0250c9c4a0e8"
          CANGJIE_COMPILER_SCHEMA_REV: "2fe6b291d37153aa1da56c6c7c020d5ab67fa93d"
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            xattr -dr com.apple.quarantine "${CANGJIE_SDK_ROOT}" || true
          fi
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # flatc is built with this MinGW toolchain, so its runtime DLLs must win lookup.
            mingw_runtime_bin="$(cygpath -u 'C:/mingw64/bin')"
            test -d "${mingw_runtime_bin}"
            export PATH="${mingw_runtime_bin}:${PATH}"
          fi
          stdx_dir="${RUNNER_TEMP}/cangjie-stdx"
          compiler_schema_dir="${RUNNER_TEMP}/cangjie_compiler"
          git init "${compiler_schema_dir}"
          git -C "${compiler_schema_dir}" remote add origin https://gitcode.com/Cangjie/cangjie_compiler.git
          git -C "${compiler_schema_dir}" sparse-checkout init --cone
          git -C "${compiler_schema_dir}" sparse-checkout set schema include
          git -C "${compiler_schema_dir}" fetch --depth 1 --filter=blob:none origin "${CANGJIE_COMPILER_SCHEMA_REV}"
          git -C "${compiler_schema_dir}" checkout --detach FETCH_HEAD
          test "$(git -C "${compiler_schema_dir}" rev-parse HEAD)" = "${CANGJIE_COMPILER_SCHEMA_REV}"
          test -s "${compiler_schema_dir}/schema/PackageFormat.fbs"
          test -d "${compiler_schema_dir}/include/cangjie"
          if [[ ! -d "${CANGJIE_SDK_ROOT}/include/cangjie" ]]; then
            # macOS and Windows STS archives omit headers required by stdx syntax.
            mkdir -p "${CANGJIE_SDK_ROOT}/include"
            cp -R "${compiler_schema_dir}/include/cangjie" "${CANGJIE_SDK_ROOT}/include/"
          fi
          git init "${stdx_dir}"
          git -C "${stdx_dir}" remote add origin https://gitcode.com/Cangjie/cangjie_stdx.git
          git -C "${stdx_dir}" fetch --depth 1 origin "${CANGJIE_STDX_SOURCE_REV}"
          git -C "${stdx_dir}" checkout --detach FETCH_HEAD
          test "$(git -C "${stdx_dir}" rev-parse HEAD)" = "${CANGJIE_STDX_SOURCE_REV}"
          cd "${stdx_dir}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            # Keep upstream OpenSSL callback casts from failing under -Werror.
            wrapper_dir="${RUNNER_TEMP}/clang-wrappers"
            mkdir -p "${wrapper_dir}"
            for compiler in clang clang++; do
              real_compiler="$(command -v "${compiler}")"
              wrapper="${wrapper_dir}/${compiler}"
              # Keep upstream OpenSSL and SDK/libc++ warnings non-fatal under -Werror.
              printf '#!/bin/sh\nexec "%s" "$@" -Wno-error=cast-function-type-mismatch -Wno-error=invalid-specialization\n' "${real_compiler}" > "${wrapper}"
              chmod +x "${wrapper}"
            done
            export PATH="${wrapper_dir}:${PATH}"
          fi
          # Keep target generation serial; parallel CI builds lost generated plugin artifacts.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            build_dir="${stdx_dir}/build_temp/build"
            cmake_include="${RUNNER_TEMP}/mingw-boundscheck.cmake"
            cat > "${cmake_include}" <<'CMAKE'
          # MinGW's secure CRT overlaps the secure stdio definitions built by boundscheck.
          function(cjdoc_avoid_mingw_secure_stdio_redefinition)
            foreach(target boundscheck boundscheck-static)
              if(TARGET "${target}")
                target_compile_definitions("${target}" PRIVATE _INC_STDIO_S)
              endif()
            endforeach()
          endfunction()
          cmake_language(DEFER CALL cjdoc_avoid_mingw_secure_stdio_redefinition)
          CMAKE
            cmake -S "${stdx_dir}" -B "${build_dir}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="${stdx_dir}/build/common/mingw_x86_64_toolchain.cmake" \
              -DCMAKE_INSTALL_PREFIX="${stdx_dir}/target" \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="${cmake_include}" \
              -DCANGJIE_SCHEMA_DIR="${compiler_schema_dir}/schema" \
              -DCANGJIE_TARGET_LIB= \
              -DCANGJIE_TARGET_TOOLCHAIN= \
              -DCANGJIE_INCLUDE= \
              -DCANGJIE_TARGET_SYSROOT= \
              -DCANGJIE_BUILD_WITHOUT_EFFECT_HANDLERS=OFF \
              -DCANGJIE_BUILD_WITHOUT_SYNTAX=OFF \
              -DCANGJIE_BUILD_WITHOUT_CHIR=OFF \
              -DCANGJIE_BUILD_WITHOUT_PLUGIN=OFF \
              -DCANGJIE_BUILD_WITHOUT_ASPECT_CJ=OFF \
              -DCANGJIE_BUILD_STDLIB_WITH_COVERAGE=OFF \
              -DCANGJIE_BUILD_ARGS= \
              -DBUILD_GCC_TOOLCHAIN=
            # The pinned CHIR script probes bin/flatc, while Windows installs flatc.exe.
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=core.protectNTFS \
              GIT_CONFIG_VALUE_0=false \
              cmake --build "${build_dir}" --target flatbuffers --parallel
            test -f "${build_dir}/bin/flatc.exe"
            # Native Python avoids MSYS resolving both names to the .exe file.
            flatc_exe="$(cygpath -w "${build_dir}/bin/flatc.exe")"
            # cygpath resolves the missing executable path to the existing .exe file.
            flatc_alias="${flatc_exe%.exe}"
            python -c 'import shutil, sys; shutil.copyfile(sys.argv[1], sys.argv[2])' \
              "${flatc_exe}" "${flatc_alias}"
            test -f "${build_dir}/bin/flatc"
            "${flatc_alias}" --version
            # The compile-time macro loads dependencies from both generated DLL directories.
            stdx_build_bin="$(cygpath -u "${build_dir}/bin")"
            stdx_library_bin="$(cygpath -u "${build_dir}/lib/windows_x86_64_cjnative")"
            export PATH="${stdx_build_bin}:${stdx_library_bin}:${PATH}"
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=core.protectNTFS \
              GIT_CONFIG_VALUE_0=false \
              cmake --build "${build_dir}" --parallel 1
            cmake --install "${build_dir}" --config Release
          else
            python build.py build --build-type release --jobs 1
            python build.py install
          fi
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            Linux:X64) stdx_target=linux_x86_64 ;;
            macOS:ARM64) stdx_target=darwin_aarch64 ;;
            Windows:X64) stdx_target=windows_x86_64 ;;
            *)
              echo "Unsupported stdx CI target: ${RUNNER_OS}/${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          sidecar="${stdx_dir}/target/${stdx_target}_cjnative/static/stdx"
          test -d "${sidecar}"
          echo "CJDOC_STDX_PATH=${sidecar}" >> "${GITHUB_ENV}"

      - name: Diagnose Windows STS macro-linked target
        if: failure() && matrix.platform == 'windows-x64'
        continue-on-error: true
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          build_dir="${RUNNER_TEMP}/cangjie-stdx/build_temp/build"
          mingw_runtime_bin="$(cygpath -u 'C:/mingw64/bin')"
          stdx_build_bin="$(cygpath -u "${build_dir}/bin")"
          stdx_library_bin="$(cygpath -u "${build_dir}/lib/windows_x86_64_cjnative")"
          export PATH="${mingw_runtime_bin}:${stdx_build_bin}:${stdx_library_bin}:${PATH}"
          batch_files=("${build_dir}"/src/CMakeFiles/stdx.aspect_cj.plugins.collect_aspects.a-*.bat)
          if [[ -e "${batch_files[0]}" ]]; then
            for batch in "${batch_files[@]}"; do
              printf '\n--- generated compile batch: %s ---\n' "${batch}"
              sed -n '1,12p' "${batch}"
            done
          else
            echo "generated CollectAspects batch file is missing" >&2
          fi
          cmake --build "${build_dir}" --target cangjieCJNATIVECollectAspects --verbose --parallel 1

      - name: Verify built STS stdx sidecar
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          python scripts/with_stdx.py --variant static --print-env --

      - name: Snapshot pristine source-edge fixture
        id: source-edge-snapshot
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          cp -p tests/fixtures/projects/source_edges/src/fixture.cj \
            "${RUNNER_TEMP}/source-edge-fixture.cj"

      - name: Run v9 local acceptance gate
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          cjc -v
          cjpm -v
          python scripts/with_stdx.py --variant static -- scripts/check.sh
          if [[ "${{ matrix.platform }}" == 'linux-x64' ]]; then
            python scripts/with_stdx.py --variant static -- \
              python scripts/real_repository_smoke.py --project .
          fi
      - name: Restore pristine source-edge fixture
        id: restore-source-edge
        if: always() && matrix.platform == 'macos-arm64' && steps.source-edge-snapshot.outcome == 'success'
        shell: bash
        run: |
          cp -p "${RUNNER_TEMP}/source-edge-fixture.cj" \
            tests/fixtures/projects/source_edges/src/fixture.cj

      - name: Regenerate macOS STS golden candidates
        id: macos-goldens
        if: failure() && matrix.platform == 'macos-arm64' && steps.restore-source-edge.outcome == 'success'
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          bash scripts/update_goldens.sh

      - name: Upload macOS STS golden candidates
        if: always() && steps.macos-goldens.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sts-golden-candidates-macos-arm64
          path: tests/fixtures/golden-v10/*.docs.json
          if-no-files-found: error

      - name: Compare Linux STS dynamic stdx test behavior
        if: failure() && matrix.platform == 'linux-x64'
        continue-on-error: true
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          dynamic_sidecar="${RUNNER_TEMP}/cangjie-stdx/target/linux_x86_64_cjnative/dynamic/stdx"
          test -d "${dynamic_sidecar}"
          export CANGJIE_STDX_PATH="${dynamic_sidecar}"
          python scripts/with_stdx.py --variant dynamic --print-env --
          python scripts/safe_output_root.py --repo . --directory target --allow-missing >/dev/null
          rm -rf target
          python scripts/with_stdx.py --variant dynamic -- cjpm test --jobs 1
