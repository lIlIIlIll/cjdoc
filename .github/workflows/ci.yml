name: Native LLVM evidence (manual diagnostic only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture one native target, or inspect the original SDK cache without executing tools
        type: choice
        options: [capture, cache-identity, original-pipeline, original-full-gate]
        default: capture

permissions:
  contents: read

jobs:
  capture:
    if: ${{ inputs.mode == 'capture' }}
    name: Native evidence / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # macOS receipts are already accepted; this follow-up needs Windows only.
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"
      DIAGNOSTIC_PLATFORM: ${{ matrix.platform }}
    steps:
      # Controller and frozen product source deliberately have separate checkouts.
      - name: Check out diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - name: Check out frozen product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4dc5f81e8ff03086f914e3721eb566e9e5007f75
          path: product
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up the original STS SDK with stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: "1.2.0"
          components: stdx
          cjv-version: v0.3.2
      - name: Run native preflight, one target, and conditional backend trace
        shell: bash
        env:
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/native-codegen-evidence
        run: |
          set -euo pipefail
          # This is a separate diagnostic. Do not retry or classify a capture miss
          # as a compiler non-reproduction. The controller preserves child failure.
          # Only a captured yjson llc failure may trigger one bounded backend
          # observation; it cannot change the original target result.
          python controller/scripts/native_codegen_capture.py \
            --source "$GITHUB_WORKSPACE/product" \
            --platform "$DIAGNOSTIC_PLATFORM" \
            --dependency-checkout windows-crlf \
            --output "$DIAGNOSTIC_OUTPUT"
      - name: Upload reviewed diagnostic files only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Raw logs, bitcode, and source inventories stay in the private task.
          # A withheld .ll is intentionally absent; receipt.json explains why.
          path: |
            ${{ runner.temp }}/native-codegen-evidence/public/receipt.json
            ${{ runner.temp }}/native-codegen-evidence/public/build.sanitized.log
            ${{ runner.temp }}/native-codegen-evidence/public/yjson.derived.ll
          if-no-files-found: warn
          retention-days: 3


  original-pipeline:
    name: Original Windows stage process chain
    if: ${{ inputs.mode == 'original-pipeline' }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CJDOC_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"
      CANGJIE_SDK_VERSION: "1.2.0"
      CJDOC_CI_EVIDENCE: ${{ github.workspace }}/target/ci-evidence
      CJDOC_ORIGINAL_CACHE_KEY: cjv-Windows-X64-1.2.0-sts-stdx-cjv0.3.2-9349612e70a9ae9742c02c4e3f422f16bbcad64558642de81e578e6ef79cf932
    steps:
      - name: Check out diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - name: Move the controller outside the original workspace
        shell: pwsh
        env:
          DIAGNOSTIC_CONTROLLER: ${{ runner.temp }}/cjdoc-diagnostic-controller
        run: |
          if (Test-Path -LiteralPath $env:DIAGNOSTIC_CONTROLLER) { throw 'Controller destination already exists' }
          Move-Item -LiteralPath "$env:GITHUB_WORKSPACE/controller" -Destination $env:DIAGNOSTIC_CONTROLLER
      - name: Check out frozen source at the original workspace root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4dc5f81e8ff03086f914e3721eb566e9e5007f75
          persist-credentials: false
      - name: Enable original Windows long paths
        shell: bash
        run: git config --global core.longpaths true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore the exact original SDK cache without saving
        id: original-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/setup-cangjie-cjv
          key: ${{ env.CJDOC_ORIGINAL_CACHE_KEY }}
          fail-on-cache-miss: true
          enableCrossOsArchive: false
      - name: Require an exact original cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.original-cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.original-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$CACHE_MATCHED" = "$CJDOC_ORIGINAL_CACHE_KEY"
      - name: Set up the original STS SDK with stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: "1.2.0"
          components: stdx
          cjv-version: v0.3.2
      - name: Export the original authenticated stdx environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/with_stdx.py --variant static --print-env -- | tee -a "$GITHUB_ENV"
      - name: Observe original preflight and build stages once
        shell: bash
        env:
          CJDOC_CACHE_STATE: cjv=hit
          DIAGNOSTIC_CONTROLLER: ${{ runner.temp }}/cjdoc-diagnostic-controller
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/original-pipeline-evidence
        run: |
          set -euo pipefail
          python "$DIAGNOSTIC_CONTROLLER/scripts/pipeline_codegen_capture.py" \
            --source "$GITHUB_WORKSPACE" --output "$DIAGNOSTIC_OUTPUT"
      - name: Upload scanned diagnostic outputs only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-pipeline-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/original-pipeline-evidence/public/receipt.json
            ${{ runner.temp }}/original-pipeline-evidence/public/build.sanitized.log
            ${{ runner.temp }}/original-pipeline-evidence/public/yjson.derived.ll
          retention-days: 3
          if-no-files-found: warn

  original-full-gate:
    name: Original full gate / ${{ matrix.platform }}
    if: ${{ inputs.mode == 'original-full-gate' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            cache_os: macOS
            cache_arch: ARM64
    runs-on: ${{ matrix.runner }}
    # Original stage bounds stay intact; allow the one conditional 600s trace.
    timeout-minutes: 120
    env:
      DIAGNOSTIC_PLATFORM: ${{ matrix.platform }}
      CJDOC_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"
      CANGJIE_SDK_VERSION: "1.2.0"
      CJDOC_CI_EVIDENCE: ${{ github.workspace }}/target/ci-evidence
      CJDOC_ORIGINAL_CACHE_KEY: cjv-${{ matrix.cache_os }}-${{ matrix.cache_arch }}-1.2.0-sts-stdx-cjv0.3.2-9349612e70a9ae9742c02c4e3f422f16bbcad64558642de81e578e6ef79cf932
    steps:
      - name: Check out diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Move the controller outside the original workspace
        shell: bash
        env:
          DIAGNOSTIC_CONTROLLER: ${{ runner.temp }}/cjdoc-diagnostic-controller
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          import shutil
          import sys
          source = Path(os.environ['GITHUB_WORKSPACE']) / 'controller'
          destination = Path(os.environ['DIAGNOSTIC_CONTROLLER'])
          try:
              if source.is_symlink() or not source.is_dir() or destination.exists() or destination.is_symlink():
                  raise ValueError('controller relocation boundary refused')
              shutil.move(str(source), str(destination))
          except Exception:
              print('Diagnostic controller relocation failed; private exception withheld.', file=sys.stderr)
              raise SystemExit(2)
          PYCODE
      - name: Check out frozen source at the original workspace root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c98e1db12cda9fa5ec5171ed53050d7372349ce1
          persist-credentials: false
      - name: Enable original Windows long paths
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: git config --global core.longpaths true
      - name: Restore the exact original SDK cache without saving
        id: original-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/setup-cangjie-cjv
          key: ${{ env.CJDOC_ORIGINAL_CACHE_KEY }}
          fail-on-cache-miss: true
          enableCrossOsArchive: false
      - name: Require an exact original cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.original-cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.original-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$CACHE_MATCHED" = "$CJDOC_ORIGINAL_CACHE_KEY"
      - name: Set up the original STS SDK with stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: "1.2.0"
          components: stdx
          cjv-version: v0.3.2
      - name: Export the original authenticated stdx environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/with_stdx.py --variant static --print-env -- | tee -a "$GITHUB_ENV"
      - name: Observe the original full acceptance gate once
        shell: bash
        env:
          CJDOC_CACHE_STATE: cjv=hit
          DIAGNOSTIC_CONTROLLER: ${{ runner.temp }}/cjdoc-diagnostic-controller
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/original-full-gate-evidence
        run: |
          set -euo pipefail
          host_bash="$BASH"
          if command -v cygpath >/dev/null 2>&1; then host_bash="$(cygpath -w "$host_bash")"; fi
          export CJDOC_ORIGINAL_BASH="$host_bash"
          python "$DIAGNOSTIC_CONTROLLER/scripts/full_gate_codegen_capture.py" \
            --source "$GITHUB_WORKSPACE" --platform "$DIAGNOSTIC_PLATFORM" --output "$DIAGNOSTIC_OUTPUT"
      - name: Upload scanned diagnostic outputs only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-full-gate-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/original-full-gate-evidence/public/receipt.json
            ${{ runner.temp }}/original-full-gate-evidence/public/build.sanitized.log
            ${{ runner.temp }}/original-full-gate-evidence/public/yjson.derived.ll
          retention-days: 3
          if-no-files-found: warn

  cache-identity:
    name: Original SDK cache bytes / ${{ matrix.os }}
    if: ${{ inputs.mode == 'cache-identity' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            cache_os: Windows
            cache_arch: X64
          - os: macos-15
            cache_os: macOS
            cache_arch: ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      # Exact key observed in the failed 40426118304 jobs; no prefix fallback.
      CJDOC_ORIGINAL_CACHE_KEY: cjv-${{ matrix.cache_os }}-${{ matrix.cache_arch }}-1.2.0-sts-stdx-cjv0.3.2-9349612e70a9ae9742c02c4e3f422f16bbcad64558642de81e578e6ef79cf932
    steps:
      - name: Check out the read-only cache inspector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore the exact original cache without saving or SDK setup
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/setup-cangjie-cjv
          key: ${{ env.CJDOC_ORIGINAL_CACHE_KEY }}
          fail-on-cache-miss: true
          enableCrossOsArchive: false
      - name: Read cached compiler and LLVM bytes without executing them
        shell: bash
        env:
          CJDOC_CACHE_REQUESTED: ${{ env.CJDOC_ORIGINAL_CACHE_KEY }}
          CJDOC_CACHE_MATCHED: ${{ steps.sdk-cache.outputs.cache-matched-key }}
          CJDOC_CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
          CJDOC_CACHE_ROOT: ${{ runner.temp }}/setup-cangjie-cjv
          CJDOC_CACHE_OUTPUT: ${{ runner.temp }}/original-sdk-cache-identity
        run: |
          set -euo pipefail
          python controller/scripts/sdk_cache_identity.py \
            --cache "$CJDOC_CACHE_ROOT" --output "$CJDOC_CACHE_OUTPUT"
      - name: Upload the scanned cache identity receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cached-sdk-identity-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/original-sdk-cache-identity/receipt.json
          retention-days: 3
          if-no-files-found: warn
