name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: ${{ matrix.platform }} / Cangjie 1.3 + stdx
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            sdk_url: "${{ vars.CANGJIE_1_3_LINUX_X64_URL }}"
            sdk_sha256: "${{ vars.CANGJIE_1_3_LINUX_X64_SHA256 }}"
            stdx_url: "${{ vars.CANGJIE_STDX_1_3_LINUX_X64_URL }}"
            stdx_sha256: "${{ vars.CANGJIE_STDX_1_3_LINUX_X64_SHA256 }}"
          - platform: windows-x64
            runner: windows-2025
            sdk_url: "${{ vars.CANGJIE_1_3_WINDOWS_X64_URL }}"
            sdk_sha256: "${{ vars.CANGJIE_1_3_WINDOWS_X64_SHA256 }}"
            stdx_url: "${{ vars.CANGJIE_STDX_1_3_WINDOWS_X64_URL }}"
            stdx_sha256: "${{ vars.CANGJIE_STDX_1_3_WINDOWS_X64_SHA256 }}"
          - platform: macos-arm64
            runner: macos-15
            sdk_url: "${{ vars.CANGJIE_1_3_MACOS_ARM64_URL }}"
            sdk_sha256: "${{ vars.CANGJIE_1_3_MACOS_ARM64_SHA256 }}"
            stdx_url: "${{ vars.CANGJIE_STDX_1_3_MACOS_ARM64_URL }}"
            stdx_sha256: "${{ vars.CANGJIE_STDX_1_3_MACOS_ARM64_SHA256 }}"

    env:
      CJDOC_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Windows long paths
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: git config --global core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tracked repository inputs
        run: python scripts/verify_repository_inputs.py --require-tracked

      - name: Test SDK installer
        run: python -m unittest scripts/test_install_cangjie_sdk.py

      - name: Restore Cangjie SDK
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cangjie-sdk-1.3-stdx
          key: cangjie-sdk-${{ matrix.platform }}-${{ matrix.sdk_sha256 }}-${{ matrix.stdx_sha256 }}-v4-authenticated-archive

      - name: Install checksum-pinned Cangjie SDK
        id: sdk
        shell: bash
        env:
          CANGJIE_SDK_URL: ${{ matrix.sdk_url }}
          CANGJIE_SDK_SHA256: ${{ matrix.sdk_sha256 }}
          CANGJIE_STDX_URL: ${{ matrix.stdx_url }}
          CANGJIE_STDX_SHA256: ${{ matrix.stdx_sha256 }}
        run: |
          test -n "${CANGJIE_SDK_URL}"
          [[ "${CANGJIE_SDK_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test -n "${CANGJIE_STDX_URL}"
          [[ "${CANGJIE_STDX_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          python scripts/install_cangjie_sdk.py \
            --url "${CANGJIE_SDK_URL}" \
            --sha256 "${CANGJIE_SDK_SHA256}" \
            --stdx-url "${CANGJIE_STDX_URL}" \
            --stdx-sha256 "${CANGJIE_STDX_SHA256}" \
            --destination "${RUNNER_TEMP}/cangjie-sdk-1.3-stdx" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Run v9 local acceptance gate
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            xattr -dr com.apple.quarantine "${CANGJIE_SDK_ROOT}" || true
          fi
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          test -n "${{ steps.sdk.outputs.stdx }}"
          cjc -v
          cjpm -v
          python scripts/with_stdx.py --variant static -- scripts/check.sh
          if [[ "${{ matrix.platform }}" == "linux-x64" ]]; then
            python scripts/with_stdx.py --variant static -- \
              python scripts/real_repository_smoke.py --project .
          fi
