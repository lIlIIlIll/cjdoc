name: Windows markdown compiler capture (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-markdown-capture-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  capture:
    name: Windows markdown compiler capture (diagnostic only)
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"
      CANGJIE_SDK_VERSION: "1.2.0"
    steps:
      - name: Check out the diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false

      - name: Check out the frozen product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f8e5b8f0ac95ef5187b6c84d716dc9f3693fcdd1
          path: source
          persist-credentials: false

      - name: Enable Windows long paths
        shell: bash
        run: git config --global core.longpaths true

      # Keep the original failed job's Python/setup pins for this observation.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up the original STS SDK and stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: "1.2.0"
          components: stdx
          cjv-version: v0.3.2

      - name: Capture exactly one product build
        shell: pwsh
        run: |
          python control/scripts/windows_codegen_capture.py --source source --out "$env:RUNNER_TEMP/cjdoc-markdown-capture"
          exit $LASTEXITCODE

      - name: Upload only inspected diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-markdown-codegen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cjdoc-markdown-capture/upload/receipt.json
            ${{ runner.temp }}/cjdoc-markdown-capture/upload/tools.json
            ${{ runner.temp }}/cjdoc-markdown-capture/upload/build.log
            ${{ runner.temp }}/cjdoc-markdown-capture/upload/argv.json
            ${{ runner.temp }}/cjdoc-markdown-capture/upload/manifest.diff
            ${{ runner.temp }}/cjdoc-markdown-capture/upload/markdown.opt.bc
          if-no-files-found: error
          retention-days: 3
