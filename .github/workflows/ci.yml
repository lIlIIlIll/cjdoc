name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: ${{ matrix.platform }} / Cangjie 1.2.0 STS + stdx release/1.2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.2.0.tar.gz&objectKey=6ab1e26eece1f87ff5befa73"
            sdk_sha256: "8c5fd944cd9cc51ee63d4a240e3ecc4f540345dae1468e8b47c927ecf2ba998f"
          - platform: windows-x64
            runner: windows-2022
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-windows-x64-1.2.0.zip&objectKey=6ab1eafae4bd101f57762f5e"
            sdk_sha256: "7bd5088ad56fb03c1214e73ea076de5ac08580cc419a8cbd46a524ee1ca250bf"
          - platform: macos-arm64
            runner: macos-15
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-mac-aarch64-1.2.0.tar.gz&objectKey=6ab1e6451320215435b23d52"
            sdk_sha256: "de88d6ba2185c94979e0ab2fe8ac1d81535dfdff3fcb51fbba71e4b99d851f97"

    env:
      CJDOC_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Windows long paths
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: git config --global core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tracked repository inputs
        run: python scripts/verify_repository_inputs.py --require-tracked

      - name: Test SDK installer
        run: python -m unittest scripts/test_install_cangjie_sdk.py

      - name: Install stdx build Python dependency
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            python_command=python3
          else
            python_command=python
          fi
          "${python_command}" -m pip install --disable-pip-version-check psutil
          "${python_command}" -c 'import psutil'

      - name: Install Windows STS stdx build tools
        if: matrix.platform == 'windows-x64'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: mingw-w64-x86_64-openssl

      - name: Set Windows STS stdx OpenSSL search path
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $opensslRoot = Join-Path $env:MSYS2_LOCATION 'mingw64'
          "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$opensslRoot" >> $env:GITHUB_ENV

      - name: Add macOS LLVM archiver to PATH
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          llvm_ar="$(xcrun --find llvm-ar 2>/dev/null || true)"
          llvm_bin=""
          if [[ -n "${llvm_ar}" ]]; then
            llvm_bin="$(dirname "${llvm_ar}")"
          fi
          if [[ -z "${llvm_bin}" || ! -x "${llvm_bin}/llvm-ranlib" ]]; then
            brew install llvm
            llvm_bin="$(brew --prefix llvm)/bin"
          fi
          test -x "${llvm_bin}/llvm-ar"
          test -x "${llvm_bin}/llvm-ranlib"
          echo "${llvm_bin}" >> "${GITHUB_PATH}"

      - name: Restore Cangjie STS SDK
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cangjie-sdk-1.2.0
          key: cangjie-sdk-${{ matrix.platform }}-${{ matrix.sdk_sha256 }}-sts-1.2.0-v4

      - name: Install checksum-pinned Cangjie STS SDK
        id: sdk
        shell: bash
        env:
          CANGJIE_SDK_URL: ${{ matrix.sdk_url }}
          CANGJIE_SDK_SHA256: ${{ matrix.sdk_sha256 }}
        run: |
          set -euo pipefail
          test -n "${CANGJIE_SDK_URL}"
          [[ "${CANGJIE_SDK_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          python scripts/install_cangjie_sdk.py \
            --url "${CANGJIE_SDK_URL}" \
            --sha256 "${CANGJIE_SDK_SHA256}" \
            --destination "${RUNNER_TEMP}/cangjie-sdk-1.2.0" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build pinned STS stdx source
        id: stdx_build
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
          CANGJIE_STDX_SOURCE_REV: "6d53814868de41bccf5b92b1d6ff0250c9c4a0e8"
          CANGJIE_COMPILER_SCHEMA_REV: "2fe6b291d37153aa1da56c6c7c020d5ab67fa93d"
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            xattr -dr com.apple.quarantine "${CANGJIE_SDK_ROOT}" || true
          fi
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # Keep the flatc toolchain first and expose its MSYS2 OpenSSL DLLs.
            mingw_runtime_bin="$(cygpath -u 'C:/mingw64/bin')"
            msys2_runtime_bin="$(cygpath -u "${MSYS2_LOCATION}/mingw64/bin")"
            test -d "${mingw_runtime_bin}"
            test -d "${msys2_runtime_bin}"
            export PATH="${mingw_runtime_bin}:${msys2_runtime_bin}:${PATH}"
          fi
          stdx_dir="${RUNNER_TEMP}/cangjie-stdx"
          compiler_schema_dir="${RUNNER_TEMP}/cangjie_compiler"
          git init "${compiler_schema_dir}"
          git -C "${compiler_schema_dir}" remote add origin https://gitcode.com/Cangjie/cangjie_compiler.git
          git -C "${compiler_schema_dir}" sparse-checkout init --cone
          git -C "${compiler_schema_dir}" sparse-checkout set schema include
          git -C "${compiler_schema_dir}" fetch --depth 1 --filter=blob:none origin "${CANGJIE_COMPILER_SCHEMA_REV}"
          git -C "${compiler_schema_dir}" checkout --detach FETCH_HEAD
          test "$(git -C "${compiler_schema_dir}" rev-parse HEAD)" = "${CANGJIE_COMPILER_SCHEMA_REV}"
          test -s "${compiler_schema_dir}/schema/PackageFormat.fbs"
          test -d "${compiler_schema_dir}/include/cangjie"
          git init "${stdx_dir}"
          git -C "${stdx_dir}" remote add origin https://gitcode.com/Cangjie/cangjie_stdx.git
          git -C "${stdx_dir}" fetch --depth 1 origin "${CANGJIE_STDX_SOURCE_REV}"
          git -C "${stdx_dir}" checkout --detach FETCH_HEAD
          test "$(git -C "${stdx_dir}" rev-parse HEAD)" = "${CANGJIE_STDX_SOURCE_REV}"
          # Avoid native Windows PATH-list splitting while retaining every macro DLL directory.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            python - "${stdx_dir}/build/common/modules/AddCangjieSource.cmake" <<'PY'
          from pathlib import Path
          import sys

          module = Path(sys.argv[1])
          source = module.read_bytes()
          newline = b"\r\n" if b"\r\n" in source else b"\n"
          needle = b"    if(CMAKE_CROSSCOMPILING AND CANGJIELIB_LINK_LIBS)" + newline
          replacement = newline.join(
              (
                  b"    if(CMAKE_CROSSCOMPILING AND CANGJIELIB_LINK_LIBS",
                  b'       AND NOT (CMAKE_HOST_SYSTEM_NAME STREQUAL "Windows"',
                  b'           AND CMAKE_SYSTEM_NAME STREQUAL "Windows"',
                  b'           AND CMAKE_HOST_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$"',
                  b'           AND CMAKE_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$"))',
                  b"",
              )
          )
          if source.count(needle) != 1:
              raise SystemExit("expected one cross-host macro PATH condition in AddCangjieSource.cmake")
          source = source.replace(needle, replacement, 1)

          environment_marker = b"    set(_cj_lib_compile_env" + newline
          environment_start = source.find(environment_marker)
          macro_link_condition = b"    if(CANGJIELIB_LINK_MACRO_LIBS)" + newline
          condition_start = source.find(macro_link_condition, environment_start)
          append_marker = b"        list(APPEND _cj_lib_compile_env" + newline
          append_start = source.find(append_marker, condition_start)
          append_end_marker = newline + b"    endif()" + newline
          append_end = source.find(append_end_marker, append_start)
          if min(environment_start, condition_start, append_start, append_end) < 0:
              raise SystemExit("expected stdx native macro PATH list in AddCangjieSource.cmake")
          append_block = source[append_start:append_end]
          native_path_guard = newline.join(
              (
                  b'        if(NOT (CMAKE_HOST_SYSTEM_NAME STREQUAL "Windows"',
                  b'               AND CMAKE_SYSTEM_NAME STREQUAL "Windows"',
                  b'               AND CMAKE_HOST_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$"',
                  b'               AND CMAKE_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$"))',
              )
          )
          indented_append = newline.join(b"    " + line for line in append_block.split(newline))
          guarded_append = native_path_guard + newline + indented_append + newline + b"        endif()"
          source = source[:append_start] + guarded_append + source[append_end:]
          module.write_bytes(source)
          print("guarded native Windows PATH list while preserving DLL lookup")
          PY
          fi

          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            # Keep upstream OpenSSL callback casts from failing under -Werror.
            wrapper_dir="${RUNNER_TEMP}/clang-wrappers"
            mkdir -p "${wrapper_dir}"
            for compiler in clang clang++; do
              real_compiler="$(command -v "${compiler}")"
              wrapper="${wrapper_dir}/${compiler}"
              # Keep upstream OpenSSL and SDK/libc++ warnings non-fatal under -Werror.
              printf '#!/bin/sh\nexec "%s" "$@" -Wno-error=cast-function-type-mismatch -Wno-error=invalid-specialization\n' "${real_compiler}" > "${wrapper}"
              chmod +x "${wrapper}"
            done
            export PATH="${wrapper_dir}:${PATH}"
          fi
          # Keep target generation serial; parallel CI builds lost generated plugin artifacts.
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            Linux:X64)
              stdx_target=linux_x86_64
              stdx_toolchain=linux_x86_64_toolchain.cmake
              ;;
            macOS:ARM64)
              stdx_target=darwin_aarch64
              stdx_toolchain=darwin_aarch64_toolchain.cmake
              ;;
            Windows:X64) stdx_target=windows_x86_64 ;;
            *)
              echo "Unsupported stdx CI target: ${RUNNER_OS}/${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            build_dir="${stdx_dir}/build_temp/build"
            cmake_include="${RUNNER_TEMP}/mingw-boundscheck.cmake"
            native_project_include="${RUNNER_TEMP}/mingw-native-project.cmake"
            cat > "${cmake_include}" <<'CMAKE'
          # MinGW's secure CRT overlaps the secure stdio definitions built by boundscheck.
          function(cjdoc_avoid_mingw_secure_stdio_redefinition)
            foreach(target boundscheck boundscheck-static)
              if(TARGET "${target}")
                target_compile_definitions("${target}" PRIVATE _INC_STDIO_S)
              endif()
            endforeach()
          endfunction()
          cmake_language(DEFER CALL cjdoc_avoid_mingw_secure_stdio_redefinition)
          CMAKE
            cat > "${native_project_include}" <<'CMAKE'
          # Keep native x64 Windows classification stable after every nested project() call.
          if(CMAKE_HOST_SYSTEM_NAME STREQUAL "Windows"
             AND CMAKE_SYSTEM_NAME STREQUAL "Windows"
             AND CMAKE_HOST_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$"
             AND CMAKE_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$")
            set(CMAKE_CROSSCOMPILING OFF)
          endif()
          message(STATUS
            "CMake project=${PROJECT_NAME}; host=${CMAKE_HOST_SYSTEM_NAME}/${CMAKE_HOST_SYSTEM_PROCESSOR}; target=${CMAKE_SYSTEM_NAME}/${CMAKE_SYSTEM_PROCESSOR}; cross=${CMAKE_CROSSCOMPILING}")
          CMAKE
            cmake -S "${stdx_dir}" -B "${build_dir}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="${stdx_dir}/build/common/mingw_x86_64_toolchain.cmake" \
              -DCMAKE_INSTALL_PREFIX="${stdx_dir}/target" \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="${cmake_include}" \
              -DCMAKE_PROJECT_INCLUDE="${native_project_include}" \
              -DCANGJIE_SCHEMA_DIR="${compiler_schema_dir}/schema" \
              -DCANGJIE_TARGET_LIB= \
              -DCANGJIE_TARGET_TOOLCHAIN= \
              -DCANGJIE_INCLUDE= \
              -DCANGJIE_TARGET_SYSROOT= \
              -DCANGJIE_BUILD_WITHOUT_EFFECT_HANDLERS=OFF \
              -DCANGJIE_BUILD_WITHOUT_SYNTAX=ON \
              -DCANGJIE_BUILD_WITHOUT_CHIR=OFF \
              -DCANGJIE_BUILD_WITHOUT_PLUGIN=OFF \
              -DCANGJIE_BUILD_WITHOUT_ASPECT_CJ=ON \
              -DCANGJIE_BUILD_STDLIB_WITH_COVERAGE=OFF \
              -DCANGJIE_BUILD_ARGS= \
              -DBUILD_GCC_TOOLCHAIN=
            # The pinned CHIR script probes bin/flatc, while Windows installs flatc.exe.
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=core.protectNTFS \
              GIT_CONFIG_VALUE_0=false \
              cmake --build "${build_dir}" --target flatbuffers --parallel
            test -f "${build_dir}/bin/flatc.exe"
            # Native Python avoids MSYS resolving both names to the .exe file.
            flatc_exe="$(cygpath -w "${build_dir}/bin/flatc.exe")"
            # cygpath resolves the missing executable path to the existing .exe file.
            flatc_alias="${flatc_exe%.exe}"
            python -c 'import shutil, sys; shutil.copyfile(sys.argv[1], sys.argv[2])' \
              "${flatc_exe}" "${flatc_alias}"
            test -f "${build_dir}/bin/flatc"
            "${flatc_alias}" --version
            # Macro generators need the build, stdx, and SDK DLL roots on PATH.
            stdx_build_bin="$(cygpath -u "${build_dir}/bin")"
            stdx_library_bin="$(cygpath -u "${build_dir}/lib/windows_x86_64_cjnative")"
            stdx_library_root="$(cygpath -u "${build_dir}/lib")"
            sdk_runtime_bin="$(cygpath -u "${CANGJIE_SDK_ROOT}/runtime/lib/windows_x86_64_cjnative")"
            sdk_tools_lib="$(cygpath -u "${CANGJIE_SDK_ROOT}/tools/lib")"
            test -d "${stdx_library_root}"
            test -d "${sdk_runtime_bin}"
            test -d "${sdk_tools_lib}"
            export PATH="${stdx_build_bin}:${stdx_library_bin}:${stdx_library_root}:${sdk_runtime_bin}:${sdk_tools_lib}:${PATH}"
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=core.protectNTFS \
              GIT_CONFIG_VALUE_0=false \
              cmake --build "${build_dir}" --target stdx.chir --parallel 1
          else
            build_dir="${stdx_dir}/build_temp/build"
            if command -v clang >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
              export CC=clang
              export CXX=clang++
            else
              export CC=gcc
              export CXX=g++
            fi
            cmake -S "${stdx_dir}" -B "${build_dir}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="${stdx_dir}/build/common/${stdx_toolchain}" \
              -DCMAKE_INSTALL_PREFIX="${stdx_dir}/target" \
              -DCANGJIE_SCHEMA_DIR="${compiler_schema_dir}/schema" \
              -DCANGJIE_TARGET_LIB= \
              -DCANGJIE_TARGET_TOOLCHAIN= \
              -DCANGJIE_INCLUDE= \
              -DCANGJIE_TARGET_SYSROOT= \
              -DCANGJIE_BUILD_WITHOUT_EFFECT_HANDLERS=OFF \
              -DCANGJIE_BUILD_WITHOUT_SYNTAX=ON \
              -DCANGJIE_BUILD_WITHOUT_CHIR=OFF \
              -DCANGJIE_BUILD_WITHOUT_PLUGIN=OFF \
              -DCANGJIE_BUILD_WITHOUT_ASPECT_CJ=ON \
              -DCANGJIE_BUILD_STDLIB_WITH_COVERAGE=OFF \
              -DCANGJIE_BUILD_ARGS= \
              -DBUILD_GCC_TOOLCHAIN=
            cmake --build "${build_dir}" --target stdx.chir --parallel 1
          fi
          sidecar="${stdx_dir}/target/${stdx_target}_cjnative/static/stdx"
          mkdir -p "${sidecar}"
          cp "${build_dir}/modules/${stdx_target}_cjnative/stdx/stdx.chir.cjo" "${sidecar}/"
          cp "${build_dir}/lib/libstdx.chir.a" "${sidecar}/"
          test -f "${sidecar}/stdx.chir.cjo"
          test -f "${sidecar}/libstdx.chir.a"
          echo "CJDOC_STDX_PATH=${sidecar}" >> "${GITHUB_ENV}"

      - name: Verify built STS stdx sidecar
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          python scripts/with_stdx.py --variant static --print-env -- | tee -a "${GITHUB_ENV}"

      - name: Snapshot pristine source-edge fixture
        id: source-edge-snapshot
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          cp -p tests/fixtures/projects/source_edges/src/fixture.cj \
            "${RUNNER_TEMP}/source-edge-fixture.cj"

      - name: Run v9 local acceptance gate
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          cjc -v
          cjpm -v
          if [[ "${{ matrix.platform }}" != 'windows-x64' ]]; then
            # STS 1.2.0's bundled llc crashes at -O2 on the markdown/yjson CI dependencies.
            # Keep the repository default unchanged and lower optimization only for Unix CI.
            real_cjpm="$(command -v cjpm)"
            wrapper_dir="${RUNNER_TEMP}/cjpm-sts-optimization"
            mkdir -p "${wrapper_dir}"
            cat >"${wrapper_dir}/cjpm" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            build|test) ;;
            *) exec "${CJDOC_REAL_CJPM}" "$@" ;;
          esac
          if [[ "$PWD" != "${GITHUB_WORKSPACE}" ]]; then
            exec "${CJDOC_REAL_CJPM}" "$@"
          fi
          manifest="$(pwd)/cjpm.toml"
          backup="$(mktemp "${RUNNER_TEMP}/cjpm-manifest.XXXXXX")"
          cp "${manifest}" "${backup}"
          restore_manifest() {
            cp "${backup}" "${manifest}"
            rm -f "${backup}"
          }
          trap restore_manifest EXIT
          python - "${manifest}" <<'PY'
          from pathlib import Path
          import sys

          manifest = Path(sys.argv[1])
          contents = manifest.read_text(encoding="utf-8")
          needle = 'override-compile-option = ""'
          if contents.count(needle) != 1:
              raise SystemExit("expected exactly one default override-compile-option in cjpm.toml")
          updated = contents.replace(
              needle, 'override-compile-option = "-O1"', 1
          )
          manifest.write_text(updated, encoding="utf-8")
          PY
          set +e
          "${CJDOC_REAL_CJPM}" "$@"
          status=$?
          set -e
          exit "${status}"
          SH
            chmod +x "${wrapper_dir}/cjpm"
            export CJDOC_REAL_CJPM="${real_cjpm}"
            export PATH="${wrapper_dir}:${PATH}"
          fi
          bash scripts/check.sh
          if [[ "${{ matrix.platform }}" == 'linux-x64' ]]; then
            python scripts/with_stdx.py --variant static -- \
              python scripts/real_repository_smoke.py --project .
          fi

      - name: Restore pristine source-edge fixture
        id: restore-source-edge
        if: always() && matrix.platform == 'macos-arm64' && steps.source-edge-snapshot.outcome == 'success'
        shell: bash
        run: |
          cp -p "${RUNNER_TEMP}/source-edge-fixture.cj" \
            tests/fixtures/projects/source_edges/src/fixture.cj


