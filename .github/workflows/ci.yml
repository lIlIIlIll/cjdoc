name: Windows cjdoc LLVM evidence (manual diagnostic only)

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        default: windows-root
        options:
          - windows-root
          - macos-host
          - windows-provider
          - windows-root-main
          - macos-provider-main

permissions:
  contents: read

jobs:
  capture:
    if: ${{ inputs.target == 'windows-root' }}
    name: Native evidence / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"
      DIAGNOSTIC_PLATFORM: ${{ matrix.platform }}
      # cjpm's Git dependency checkouts must obey the same raw-blob policy.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      # Controller and frozen product source deliberately have separate checkouts.
      - name: Check out diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - name: Check out frozen product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Match raw Git blobs for the byte-identity preflight. This diagnostic
        # controls checkout EOL; it does not reproduce CI's CRLF checkout policy.
        with:
          ref: 62a59d5523ce6a2c9982b59b99e0ff167faea33f
          path: product
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up the original STS SDK with stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: "1.2.0"
          components: stdx
          cjv-version: v0.3.2
      - name: Run native preflight, one target, and conditional backend trace
        shell: bash
        env:
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/native-codegen-evidence
        run: |
          set -euo pipefail
          # This is a separate diagnostic. Do not retry or classify a capture miss
          # as a compiler non-reproduction. The controller preserves child failure.
          # Only a captured cjdoc llc failure may trigger one bounded backend
          # observation; it cannot change the original target result.
          python controller/scripts/native_codegen_capture.py \
            --source "$GITHUB_WORKSPACE/product" \
            --platform "$DIAGNOSTIC_PLATFORM" \
            --output "$DIAGNOSTIC_OUTPUT"
      - name: Upload reviewed diagnostic files only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Raw logs, bitcode, and source inventories stay in the private task.
          # A withheld .ll is intentionally absent; receipt.json explains why.
          path: |
            ${{ runner.temp }}/native-codegen-evidence/public/receipt.json
            ${{ runner.temp }}/native-codegen-evidence/public/build.sanitized.log
            ${{ runner.temp }}/native-codegen-evidence/public/cjdoc.derived.ll
          if-no-files-found: warn
          retention-days: 3

  macos-host:
    if: ${{ inputs.target == 'macos-host' }}
    uses: ./.github/workflows/highlight-host-diagnostic.yml

  windows-provider:
    if: ${{ inputs.target == 'windows-provider' }}
    uses: ./.github/workflows/highlight-host-diagnostic.yml
    with:
      profile: windows-provider

  windows-root-main:
    if: ${{ inputs.target == 'windows-root-main' }}
    uses: ./.github/workflows/highlight-host-diagnostic.yml
    with:
      profile: windows-root-main

  macos-provider-main:
    if: ${{ inputs.target == 'macos-provider-main' }}
    uses: ./.github/workflows/highlight-host-diagnostic.yml
    with:
      profile: macos-provider-main
