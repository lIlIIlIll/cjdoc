name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: ${{ matrix.platform }} / Cangjie 1.1.3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b"
            sdk_sha256: 2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a
          - platform: windows-x64
            runner: windows-2025
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-windows-x64-1.1.3.zip&objectKey=6a192b2521f5a8178d6fd222"
            sdk_sha256: 8bb65499c1b30271eaca422568bc9537677bd25debd8f5208e780a22c917da72
          - platform: macos-arm64
            runner: macos-15
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-mac-aarch64-1.1.3.tar.gz&objectKey=6a19312721f5a8178d6fd225"
            sdk_sha256: 7eff8d3b9119535cf3d05cb81526c5df391137dce908d744449f4edb99da3199

    env:
      CJDOC_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Windows long paths
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: git config --global core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tracked repository inputs
        run: python scripts/verify_repository_inputs.py --require-tracked

      - name: Test SDK installer
        run: python -m unittest scripts/test_install_cangjie_sdk.py

      - name: Restore Cangjie SDK
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cangjie-sdk-1.1.3
          key: cangjie-sdk-${{ matrix.platform }}-${{ matrix.sdk_sha256 }}-v3-authenticated-archive

      - name: Install checksum-pinned Cangjie SDK
        id: sdk
        shell: bash
        env:
          CANGJIE_SDK_URL: ${{ matrix.sdk_url }}
          CANGJIE_SDK_SHA256: ${{ matrix.sdk_sha256 }}
        run: |
          python scripts/install_cangjie_sdk.py \
            --url "${CANGJIE_SDK_URL}" \
            --sha256 "${CANGJIE_SDK_SHA256}" \
            --destination "${RUNNER_TEMP}/cangjie-sdk-1.1.3" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Run v9 local acceptance gate
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            xattr -dr com.apple.quarantine "${CANGJIE_SDK_ROOT}" || true
          fi
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          cjc -v
          cjpm -v
          scripts/check.sh

      - name: Set up Node for browser gate
        if: matrix.platform == 'linux-x64'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install Chromium browser dependencies
        if: matrix.platform == 'linux-x64'
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate and test HTML reference
        if: matrix.platform == 'linux-x64'
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
          CJDOC_HTML_FIXTURE: ${{ github.workspace }}/target/html-reference/html
        run: |
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          target/release/bin/main generate \
            --project tests/fixtures/projects/html_reference \
            --format html --format json --locale en --no-cache \
            --repository-url https://github.com/example/reference \
            --repository-revision 0123456789012345678901234567890123456789 \
            --output target/html-reference
          npm --prefix tests/browser test

      - name: Upload browser screenshots
        if: always() && matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cjdoc-browser-screenshots
          path: tests/browser/test-results/**/*.png
          if-no-files-found: ignore

      - name: Clean browser test outputs
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: rm -rf tests/browser/node_modules tests/browser/test-results tests/browser/playwright-report

      - name: Run real-repository smoke
        if: matrix.platform == 'linux-x64'
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          python scripts/real_repository_smoke.py --project .
