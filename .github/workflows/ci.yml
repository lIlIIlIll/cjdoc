name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: ${{ matrix.platform }} / Cangjie 1.2.0 STS + stdx release/1.2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.2.0.tar.gz&objectKey=6ab1e26eece1f87ff5befa73"
            sdk_sha256: "8c5fd944cd9cc51ee63d4a240e3ecc4f540345dae1468e8b47c927ecf2ba998f"
          - platform: windows-x64
            runner: windows-2022
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-windows-x64-1.2.0.zip&objectKey=6ab1eafae4bd101f57762f5e"
            sdk_sha256: "7bd5088ad56fb03c1214e73ea076de5ac08580cc419a8cbd46a524ee1ca250bf"
          - platform: macos-arm64
            runner: macos-15
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-mac-aarch64-1.2.0.tar.gz&objectKey=6ab1e6451320215435b23d52"
            sdk_sha256: "de88d6ba2185c94979e0ab2fe8ac1d81535dfdff3fcb51fbba71e4b99d851f97"

    env:
      CJDOC_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Windows long paths
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: git config --global core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tracked repository inputs
        run: python scripts/verify_repository_inputs.py --require-tracked

      - name: Test SDK installer
        run: python -m unittest scripts/test_install_cangjie_sdk.py

      - name: Install stdx build Python dependency
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            python_command=python3
          else
            python_command=python
          fi
          "${python_command}" -m pip install --disable-pip-version-check psutil
          "${python_command}" -c 'import psutil'

      - name: Install Windows STS stdx build and diagnostic tools
        if: matrix.platform == 'windows-x64'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: mingw-w64-x86_64-openssl mingw-w64-x86_64-binutils

      - name: Set Windows STS stdx OpenSSL search path
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $opensslRoot = Join-Path $env:MSYS2_LOCATION 'mingw64'
          "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$opensslRoot" >> $env:GITHUB_ENV

      - name: Add macOS LLVM archiver to PATH
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          llvm_ar="$(xcrun --find llvm-ar 2>/dev/null || true)"
          llvm_bin=""
          if [[ -n "${llvm_ar}" ]]; then
            llvm_bin="$(dirname "${llvm_ar}")"
          fi
          if [[ -z "${llvm_bin}" || ! -x "${llvm_bin}/llvm-ranlib" ]]; then
            brew install llvm
            llvm_bin="$(brew --prefix llvm)/bin"
          fi
          test -x "${llvm_bin}/llvm-ar"
          test -x "${llvm_bin}/llvm-ranlib"
          echo "${llvm_bin}" >> "${GITHUB_PATH}"

      - name: Restore Cangjie STS SDK
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cangjie-sdk-1.2.0
          key: cangjie-sdk-${{ matrix.platform }}-${{ matrix.sdk_sha256 }}-sts-1.2.0-v4

      - name: Install checksum-pinned Cangjie STS SDK
        id: sdk
        shell: bash
        env:
          CANGJIE_SDK_URL: ${{ matrix.sdk_url }}
          CANGJIE_SDK_SHA256: ${{ matrix.sdk_sha256 }}
        run: |
          set -euo pipefail
          test -n "${CANGJIE_SDK_URL}"
          [[ "${CANGJIE_SDK_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          python scripts/install_cangjie_sdk.py \
            --url "${CANGJIE_SDK_URL}" \
            --sha256 "${CANGJIE_SDK_SHA256}" \
            --destination "${RUNNER_TEMP}/cangjie-sdk-1.2.0" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build pinned STS stdx source
        id: stdx_build
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
          CANGJIE_STDX_SOURCE_REV: "6d53814868de41bccf5b92b1d6ff0250c9c4a0e8"
          CANGJIE_COMPILER_SCHEMA_REV: "2fe6b291d37153aa1da56c6c7c020d5ab67fa93d"
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            xattr -dr com.apple.quarantine "${CANGJIE_SDK_ROOT}" || true
          fi
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # Keep the flatc toolchain first and expose its MSYS2 OpenSSL DLLs.
            mingw_runtime_bin="$(cygpath -u 'C:/mingw64/bin')"
            msys2_runtime_bin="$(cygpath -u "${MSYS2_LOCATION}/mingw64/bin")"
            test -d "${mingw_runtime_bin}"
            test -d "${msys2_runtime_bin}"
            export PATH="${mingw_runtime_bin}:${msys2_runtime_bin}:${PATH}"
          fi
          stdx_dir="${RUNNER_TEMP}/cangjie-stdx"
          compiler_schema_dir="${RUNNER_TEMP}/cangjie_compiler"
          git init "${compiler_schema_dir}"
          git -C "${compiler_schema_dir}" remote add origin https://gitcode.com/Cangjie/cangjie_compiler.git
          git -C "${compiler_schema_dir}" sparse-checkout init --cone
          git -C "${compiler_schema_dir}" sparse-checkout set schema include
          git -C "${compiler_schema_dir}" fetch --depth 1 --filter=blob:none origin "${CANGJIE_COMPILER_SCHEMA_REV}"
          git -C "${compiler_schema_dir}" checkout --detach FETCH_HEAD
          test "$(git -C "${compiler_schema_dir}" rev-parse HEAD)" = "${CANGJIE_COMPILER_SCHEMA_REV}"
          test -s "${compiler_schema_dir}/schema/PackageFormat.fbs"
          test -d "${compiler_schema_dir}/include/cangjie"
          # Use pinned compiler headers through an overlay; keep the verified SDK cache immutable.
          export CANGJIE_COMPILER_INCLUDE_DIR="${compiler_schema_dir}/include"
          git init "${stdx_dir}"
          git -C "${stdx_dir}" remote add origin https://gitcode.com/Cangjie/cangjie_stdx.git
          git -C "${stdx_dir}" fetch --depth 1 origin "${CANGJIE_STDX_SOURCE_REV}"
          git -C "${stdx_dir}" checkout --detach FETCH_HEAD
          test "$(git -C "${stdx_dir}" rev-parse HEAD)" = "${CANGJIE_STDX_SOURCE_REV}"
          python - "${stdx_dir}/src/stdx/syntax/native/CMakeLists.txt" <<'PY'
          from pathlib import Path
          import sys

          cmake_file = Path(sys.argv[1])
          source = cmake_file.read_bytes()
          newline = b"\r\n" if b"\r\n" in source else b"\n"
          needle = b"    set(CANGJIE_INC_DIR $ENV{CANGJIE_HOME}/include)" + newline
          replacement = b"    set(CANGJIE_INC_DIR $ENV{CANGJIE_COMPILER_INCLUDE_DIR})" + newline
          if source.count(needle) != 1:
              raise SystemExit("expected one STS syntax compiler include assignment")
          cmake_file.write_bytes(source.replace(needle, replacement, 1))
          print("selected pinned compiler headers without changing the SDK")
          PY
          # Avoid native Windows PATH-list splitting while retaining every macro DLL directory.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            python - "${stdx_dir}/build/common/modules/AddCangjieSource.cmake" <<'PY'
          from pathlib import Path
          import sys

          module = Path(sys.argv[1])
          source = module.read_bytes()
          newline = b"\r\n" if b"\r\n" in source else b"\n"
          needle = b"    if(CMAKE_CROSSCOMPILING AND CANGJIELIB_LINK_LIBS)" + newline
          replacement = newline.join(
              (
                  b"    if(CMAKE_CROSSCOMPILING AND CANGJIELIB_LINK_LIBS",
                  b'       AND NOT (CMAKE_HOST_SYSTEM_NAME STREQUAL "Windows"',
                  b'           AND CMAKE_SYSTEM_NAME STREQUAL "Windows"',
                  b'           AND CMAKE_HOST_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$"',
                  b'           AND CMAKE_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$"))',
                  b"",
              )
          )
          if source.count(needle) != 1:
              raise SystemExit("expected one cross-host macro PATH condition in AddCangjieSource.cmake")
          source = source.replace(needle, replacement, 1)

          environment_marker = b"    set(_cj_lib_compile_env" + newline
          environment_start = source.find(environment_marker)
          macro_link_condition = b"    if(CANGJIELIB_LINK_MACRO_LIBS)" + newline
          condition_start = source.find(macro_link_condition, environment_start)
          append_marker = b"        list(APPEND _cj_lib_compile_env" + newline
          append_start = source.find(append_marker, condition_start)
          append_end_marker = newline + b"    endif()" + newline
          append_end = source.find(append_end_marker, append_start)
          if min(environment_start, condition_start, append_start, append_end) < 0:
              raise SystemExit("expected stdx native macro PATH list in AddCangjieSource.cmake")
          append_block = source[append_start:append_end]
          native_path_guard = newline.join(
              (
                  b'        if(NOT (CMAKE_HOST_SYSTEM_NAME STREQUAL "Windows"',
                  b'               AND CMAKE_SYSTEM_NAME STREQUAL "Windows"',
                  b'               AND CMAKE_HOST_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$"',
                  b'               AND CMAKE_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$"))',
              )
          )
          indented_append = newline.join(b"    " + line for line in append_block.split(newline))
          guarded_append = native_path_guard + newline + indented_append + newline + b"        endif()"
          source = source[:append_start] + guarded_append + source[append_end:]
          module.write_bytes(source)
          print("guarded native Windows PATH list while preserving DLL lookup")
          PY
          fi

          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            # Keep upstream OpenSSL callback casts from failing under -Werror.
            wrapper_dir="${RUNNER_TEMP}/clang-wrappers"
            mkdir -p "${wrapper_dir}"
            for compiler in clang clang++; do
              real_compiler="$(command -v "${compiler}")"
              wrapper="${wrapper_dir}/${compiler}"
              # Keep upstream OpenSSL and SDK/libc++ warnings non-fatal under -Werror.
              printf '#!/bin/sh\nexec "%s" "$@" -Wno-error=cast-function-type-mismatch -Wno-error=invalid-specialization\n' "${real_compiler}" > "${wrapper}"
              chmod +x "${wrapper}"
            done
            export PATH="${wrapper_dir}:${PATH}"
          fi
          # Keep target generation serial; parallel CI builds lost generated plugin artifacts.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            build_dir="${stdx_dir}/build_temp/build"
            cmake_include="${RUNNER_TEMP}/mingw-boundscheck.cmake"
            native_project_include="${RUNNER_TEMP}/mingw-native-project.cmake"
            cat > "${cmake_include}" <<'CMAKE'
          # MinGW's secure CRT overlaps the secure stdio definitions built by boundscheck.
          function(cjdoc_avoid_mingw_secure_stdio_redefinition)
            foreach(target boundscheck boundscheck-static)
              if(TARGET "${target}")
                target_compile_definitions("${target}" PRIVATE _INC_STDIO_S)
              endif()
            endforeach()
          endfunction()
          cmake_language(DEFER CALL cjdoc_avoid_mingw_secure_stdio_redefinition)
          CMAKE
            cat > "${native_project_include}" <<'CMAKE'
          # Keep native x64 Windows classification stable after every nested project() call.
          if(CMAKE_HOST_SYSTEM_NAME STREQUAL "Windows"
             AND CMAKE_SYSTEM_NAME STREQUAL "Windows"
             AND CMAKE_HOST_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$"
             AND CMAKE_SYSTEM_PROCESSOR MATCHES "^(x86_64|AMD64|amd64)$")
            set(CMAKE_CROSSCOMPILING OFF)
          endif()
          message(STATUS
            "CMake project=${PROJECT_NAME}; host=${CMAKE_HOST_SYSTEM_NAME}/${CMAKE_HOST_SYSTEM_PROCESSOR}; target=${CMAKE_SYSTEM_NAME}/${CMAKE_SYSTEM_PROCESSOR}; cross=${CMAKE_CROSSCOMPILING}")
          CMAKE
            cmake -S "${stdx_dir}" -B "${build_dir}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="${stdx_dir}/build/common/mingw_x86_64_toolchain.cmake" \
              -DCMAKE_INSTALL_PREFIX="${stdx_dir}/target" \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="${cmake_include}" \
              -DCMAKE_PROJECT_INCLUDE="${native_project_include}" \
              -DCANGJIE_SCHEMA_DIR="${compiler_schema_dir}/schema" \
              -DCANGJIE_TARGET_LIB= \
              -DCANGJIE_TARGET_TOOLCHAIN= \
              -DCANGJIE_INCLUDE= \
              -DCANGJIE_TARGET_SYSROOT= \
              -DCANGJIE_BUILD_WITHOUT_EFFECT_HANDLERS=OFF \
              -DCANGJIE_BUILD_WITHOUT_SYNTAX=OFF \
              -DCANGJIE_BUILD_WITHOUT_CHIR=OFF \
              -DCANGJIE_BUILD_WITHOUT_PLUGIN=OFF \
              -DCANGJIE_BUILD_WITHOUT_ASPECT_CJ=OFF \
              -DCANGJIE_BUILD_STDLIB_WITH_COVERAGE=OFF \
              -DCANGJIE_BUILD_ARGS= \
              -DBUILD_GCC_TOOLCHAIN=
            # The pinned CHIR script probes bin/flatc, while Windows installs flatc.exe.
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=core.protectNTFS \
              GIT_CONFIG_VALUE_0=false \
              cmake --build "${build_dir}" --target flatbuffers --parallel
            test -f "${build_dir}/bin/flatc.exe"
            # Native Python avoids MSYS resolving both names to the .exe file.
            flatc_exe="$(cygpath -w "${build_dir}/bin/flatc.exe")"
            # cygpath resolves the missing executable path to the existing .exe file.
            flatc_alias="${flatc_exe%.exe}"
            python -c 'import shutil, sys; shutil.copyfile(sys.argv[1], sys.argv[2])' \
              "${flatc_exe}" "${flatc_alias}"
            test -f "${build_dir}/bin/flatc"
            "${flatc_alias}" --version
            # Macro generators need the build, stdx, and SDK DLL roots on PATH.
            stdx_build_bin="$(cygpath -u "${build_dir}/bin")"
            stdx_library_bin="$(cygpath -u "${build_dir}/lib/windows_x86_64_cjnative")"
            stdx_library_root="$(cygpath -u "${build_dir}/lib")"
            sdk_runtime_bin="$(cygpath -u "${CANGJIE_SDK_ROOT}/runtime/lib/windows_x86_64_cjnative")"
            sdk_tools_lib="$(cygpath -u "${CANGJIE_SDK_ROOT}/tools/lib")"
            test -d "${stdx_library_root}"
            test -d "${sdk_runtime_bin}"
            test -d "${sdk_tools_lib}"
            export PATH="${stdx_build_bin}:${stdx_library_bin}:${stdx_library_root}:${sdk_runtime_bin}:${sdk_tools_lib}:${PATH}"
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=core.protectNTFS \
              GIT_CONFIG_VALUE_0=false \
              cmake --build "${build_dir}" --parallel 1
            cmake --install "${build_dir}" --config Release
          else
            cd "${stdx_dir}"
            python build.py build --build-type release --jobs 1
            python build.py install
          fi
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            Linux:X64) stdx_target=linux_x86_64 ;;
            macOS:ARM64) stdx_target=darwin_aarch64 ;;
            Windows:X64) stdx_target=windows_x86_64 ;;
            *)
              echo "Unsupported stdx CI target: ${RUNNER_OS}/${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          sidecar="${stdx_dir}/target/${stdx_target}_cjnative/static/stdx"
          test -d "${sidecar}"
          echo "CJDOC_STDX_PATH=${sidecar}" >> "${GITHUB_ENV}"

      - name: Inspect failing Windows STS macro DLL dependency closure
        if: failure() && steps.stdx_build.outcome == 'failure' && matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'cangjie-stdx'
          $plugin = Get-ChildItem -LiteralPath $buildRoot -Recurse -File -Filter 'lib-macro_stdx.plugin.dll' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $plugin) {
            Write-Host 'The generated STS macro plugin DLL is missing.'
            exit 0
          }
          $objdump = Join-Path $env:MSYS2_LOCATION 'mingw64\bin\objdump.exe'
          if (-not (Test-Path -LiteralPath $objdump)) {
            Write-Host 'MSYS2 objdump is unavailable for the generated STS macro plugin.'
            exit 0
          }
          $buildDir = Join-Path $buildRoot 'build_temp\build'
          $moduleRoot = Join-Path $buildDir 'modules\windows_x86_64_cjnative'
          $libraryRoot = Join-Path $buildDir 'lib'
          $env:CANGJIE_PATH = $moduleRoot
          $env:LIBRARY_PATH = $libraryRoot
          $pathRoots = @(
            (Join-Path $buildDir 'bin'),
            $moduleRoot,
            (Join-Path $moduleRoot 'stdx'),
            (Join-Path $libraryRoot 'windows_x86_64_cjnative'),
            $libraryRoot,
            (Join-Path $env:CANGJIE_SDK_ROOT 'runtime\lib\windows_x86_64_cjnative'),
            (Join-Path $env:CANGJIE_SDK_ROOT 'tools\lib'),
            (Join-Path $env:CANGJIE_SDK_ROOT 'tools\bin'),
            (Join-Path $env:CANGJIE_SDK_ROOT 'third_party\llvm\bin'),
            (Join-Path $env:CANGJIE_SDK_ROOT 'third_party\llvm\lib'),
            'C:\mingw64\bin',
            (Join-Path $env:MSYS2_LOCATION 'mingw64\bin')
          )
          $env:PATH = (($pathRoots + $env:PATH) -join ';')
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class CjdocNativeLoader { [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)] public static extern IntPtr LoadLibrary(string path); }'
          $module = [CjdocNativeLoader]::LoadLibrary($plugin.FullName)
          if ($module -eq [IntPtr]::Zero) {
            $errorCode = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
            $errorMessage = [System.ComponentModel.Win32Exception]::new($errorCode).Message
            Write-Host "Direct LoadLibrary failed: Win32 $errorCode ($errorMessage)"
          } else {
            Write-Host 'Direct LoadLibrary succeeded.'
          }
          $roots = [ordered]@{
            'stdx-modules' = Join-Path $buildRoot 'build_temp\build\modules'
            'stdx-libraries' = Join-Path $buildRoot 'build_temp\build\lib'
            'sdk-runtime' = Join-Path $env:CANGJIE_SDK_ROOT 'runtime\lib\windows_x86_64_cjnative'
            'sdk-tools-lib' = Join-Path $env:CANGJIE_SDK_ROOT 'tools\lib'
            'sdk-tools-bin' = Join-Path $env:CANGJIE_SDK_ROOT 'tools\bin'
            'sdk-llvm-bin' = Join-Path $env:CANGJIE_SDK_ROOT 'third_party\llvm\bin'
            'sdk-llvm-lib' = Join-Path $env:CANGJIE_SDK_ROOT 'third_party\llvm\lib'
            'mingw-toolchain' = 'C:\mingw64\bin'
            'msys2-runtime' = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
            'windows-system' = Join-Path $env:WINDIR 'System32'
          }
          $available = @{}
          foreach ($root in $roots.GetEnumerator()) {
            if (Test-Path -LiteralPath $root.Value) {
              Get-ChildItem -LiteralPath $root.Value -Recurse -File -Filter '*.dll' -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $key = $_.Name.ToLowerInvariant()
                  if (-not $available.ContainsKey($key)) {
                    $available[$key] = @{ path = $_.FullName; root = $root.Key }
                  }
                }
            }
          }
          $pending = [System.Collections.Generic.Queue[string]]::new()
          $pending.Enqueue($plugin.FullName)
          $visited = @{}
          while ($pending.Count -gt 0) {
            $dllPath = $pending.Dequeue()
            $dllKey = $dllPath.ToLowerInvariant()
            if ($visited.ContainsKey($dllKey)) { continue }
            $visited[$dllKey] = $true
            $dllName = [System.IO.Path]::GetFileName($dllPath)
            foreach ($import in @(& $objdump -p $dllPath | ForEach-Object {
              if ($_ -match '^\s*DLL Name:\s*(.+)$') { $Matches[1].Trim() }
            })) {
              $importKey = $import.ToLowerInvariant()
              if ($importKey -match '^(api-ms-win-|ext-ms-win-)') { continue }
              if (-not $available.ContainsKey($importKey)) {
                Write-Host "Missing DLL dependency: $import (imported by $dllName)"
                continue
              }
              $dependency = $available[$importKey]
              if ($dependency.root -ne 'windows-system') { $pending.Enqueue($dependency.path) }
            }
          }
          Write-Host "Inspected $($visited.Count) DLLs from the STS macro dependency closure."

      - name: Verify built STS stdx sidecar
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          python scripts/with_stdx.py --variant static --print-env --

      - name: Snapshot pristine source-edge fixture
        id: source-edge-snapshot
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          cp -p tests/fixtures/projects/source_edges/src/fixture.cj \
            "${RUNNER_TEMP}/source-edge-fixture.cj"

      - name: Run v9 local acceptance gate
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          cjc -v
          cjpm -v
          if [[ "${{ matrix.platform }}" != 'windows-x64' ]]; then
            # STS 1.2.0's bundled llc crashes at -O2 on the markdown/yjson CI dependencies.
            # Keep the repository default unchanged and lower optimization only for Unix CI.
            real_cjpm="$(command -v cjpm)"
            wrapper_dir="${RUNNER_TEMP}/cjpm-sts-optimization"
            mkdir -p "${wrapper_dir}"
            cat >"${wrapper_dir}/cjpm" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            build|test) ;;
            *) exec "${CJDOC_REAL_CJPM}" "$@" ;;
          esac
          if [[ "$PWD" != "${GITHUB_WORKSPACE}" ]]; then
            exec "${CJDOC_REAL_CJPM}" "$@"
          fi
          manifest="$(pwd)/cjpm.toml"
          backup="$(mktemp "${RUNNER_TEMP}/cjpm-manifest.XXXXXX")"
          cp "${manifest}" "${backup}"
          restore_manifest() {
            cp "${backup}" "${manifest}"
            rm -f "${backup}"
          }
          trap restore_manifest EXIT
          python - "${manifest}" <<'PY'
          from pathlib import Path
          import sys

          manifest = Path(sys.argv[1])
          contents = manifest.read_text(encoding="utf-8")
          needle = 'override-compile-option = ""'
          if contents.count(needle) != 1:
              raise SystemExit("expected exactly one default override-compile-option in cjpm.toml")
          updated = contents.replace(
              needle, 'override-compile-option = "-O1"', 1
          )
          manifest.write_text(updated, encoding="utf-8")
          PY
          set +e
          "${CJDOC_REAL_CJPM}" "$@"
          status=$?
          set -e
          exit "${status}"
          SH
            chmod +x "${wrapper_dir}/cjpm"
            export CJDOC_REAL_CJPM="${real_cjpm}"
            export PATH="${wrapper_dir}:${PATH}"
          fi
          python scripts/with_stdx.py --variant static -- scripts/check.sh
          if [[ "${{ matrix.platform }}" == 'linux-x64' ]]; then
            python scripts/with_stdx.py --variant static -- \
              python scripts/real_repository_smoke.py --project .
          fi

      - name: Probe Linux STS source generation after acceptance failure
        if: failure() && matrix.platform == 'linux-x64'
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          source "${CANGJIE_SDK_ROOT}/envsetup.sh"
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          probe_json="${RUNNER_TEMP}/cjdoc-linux-source-probe.json"
          probe_stderr="${RUNNER_TEMP}/cjdoc-linux-source-probe.stderr"
          set +e
          python scripts/with_stdx.py --variant static -- \
            target/release/bin/main generate --project tests/fixtures/projects/basic \
              --format json --stdout --no-cache >"${probe_json}" 2>"${probe_stderr}"
          probe_status=$?
          set -e
          echo "source_generation_probe_exit=${probe_status}"
          python - "${probe_json}" "${probe_stderr}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          output_path = Path(sys.argv[1])
          try:
              document = json.loads(output_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              print(f"probe_json_unavailable={type(error).__name__}")
          else:
              print(
                  "probe_result="
                  f"status:{document.get('status')} "
                  f"declarations:{len(document.get('declarations', []))} "
                  f"unsupported:{len(document.get('unsupportedDeclarations', []))}"
              )
              for diagnostic in document.get("diagnostics", []):
                  print(f"diagnostic={diagnostic.get('code')}: {diagnostic.get('message')}")

          stderr_path = Path(sys.argv[2])
          if stderr_path.is_file():
              stderr = stderr_path.read_text(encoding="utf-8", errors="replace")
              for value, replacement in (
                  (os.environ.get("GITHUB_WORKSPACE", ""), "<workspace>"),
                  (os.environ.get("RUNNER_TEMP", ""), "<runner-temp>"),
                  (str(Path.home()), "<runner-home>"),
              ):
                  if value:
                      stderr = stderr.replace(value, replacement)
              for line in stderr.splitlines()[:12]:
                  print(f"probe_stderr={line}")
          PY
          python - "${RUNNER_TEMP}/cjdoc-syntax-worker-probe" <<'PY'
          import hashlib
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          root.mkdir(parents=True, exist_ok=True)
          source = Path("tests/fixtures/projects/basic/src/api.cj").read_bytes()
          source = source.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          source_path = root / "source.cj"
          request_path = root / "request.bin"
          response_path = root / "response.bin"
          source_path.write_bytes(source)
          fields = (
              "cjdoc-syntax-worker/1",
              str(source_path.resolve()),
              str(response_path.resolve()),
              "src/api.cj",
              "basic",
              "basic",
              "basic",
              hashlib.sha256(source).hexdigest(),
          )

          def encode_field(value):
              encoded = value.encode("utf-8")
              return str(len(encoded)).encode("ascii") + b":" + encoded

          request_path.write_bytes(b"".join(encode_field(value) for value in fields))
          command = [
              sys.executable,
              "scripts/with_stdx.py",
              "--variant",
              "static",
              "--",
              str(Path("target/release/bin/main").resolve()),
              "--internal-syntax-parse",
              str(request_path.resolve()),
          ]
          try:
              result = subprocess.run(command, capture_output=True, text=True, timeout=60)
          except subprocess.TimeoutExpired:
              print("syntax_worker_probe=timeout")
              raise SystemExit(0)
          print(f"syntax_worker_probe_exit={result.returncode}")
          print(f"syntax_worker_response_exists={response_path.is_file()}")
          if response_path.is_file():
              print(f"syntax_worker_response_bytes={response_path.stat().st_size}")
          for stream in (result.stdout, result.stderr):
              for value, replacement in (
                  (os.environ.get("GITHUB_WORKSPACE", ""), "<workspace>"),
                  (os.environ.get("RUNNER_TEMP", ""), "<runner-temp>"),
                  (str(Path.home()), "<runner-home>"),
              ):
                  if value:
                      stream = stream.replace(value, replacement)
              for line in stream.splitlines()[:12]:
                  print(f"syntax_worker_probe_output={line}")
          PY

          python - "${RUNNER_TEMP}/cjdoc-diagnostic-engine-probe" <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["CANGJIE_SDK_ROOT"])
          runtime_lib = root / "runtime/lib/linux_x86_64_cjnative"
          probe_dir = Path(sys.argv[1])
          probe_dir.mkdir(parents=True, exist_ok=True)
          source_path = probe_dir / "diagnostic_engine.cpp"
          binary_path = probe_dir / "diagnostic_engine"
          source_path.write_text(
              """#include <optional>
          #include "cangjie/Basic/DiagnosticEngine.h"
          #include "cangjie/Basic/SourceManager.h"

          int main()
          {
              Cangjie::DiagnosticEngine diag;
              Cangjie::SourceManager sm;
              diag.SetSourceManager(&sm);
              diag.SetDiagnoseStatus(true);
              diag.DisableScopeCheck();
              diag.SetErrorCountLimit(std::nullopt);
              return 0;
          }
          """,
              encoding="utf-8",
          )
          compile = subprocess.run(
              [
                  "c++",
                  "-std=c++17",
                  f"-I{Path(os.environ['RUNNER_TEMP']) / 'cangjie_compiler' / 'include'}",
                  str(source_path),
                  f"-L{runtime_lib}",
                  f"-Wl,-rpath,{runtime_lib}",
                  "-lcangjie-std-ast",
                  "-o",
                  str(binary_path),
              ],
              capture_output=True,
              text=True,
              timeout=60,
          )
          print(f"diagnostic_engine_compile_exit={compile.returncode}")
          for line in (compile.stdout + compile.stderr).splitlines()[:12]:
              for value, replacement in (
                  (str(root), "<cangjie-sdk>"),
                  (os.environ.get("RUNNER_TEMP", ""), "<runner-temp>"),
                  (str(Path.home()), "<runner-home>"),
              ):
                  if value:
                      line = line.replace(value, replacement)
              print(f"diagnostic_engine_compile_output={line}")
          if compile.returncode != 0:
              raise SystemExit(0)
          try:
              run = subprocess.run([str(binary_path)], capture_output=True, text=True, timeout=30)
          except subprocess.TimeoutExpired:
              print("diagnostic_engine_run=timeout")
              raise SystemExit(0)
          print(f"diagnostic_engine_run_exit={run.returncode}")
          for line in (run.stdout + run.stderr).splitlines()[:12]:
              print(f"diagnostic_engine_run_output={line}")
          PY

      - name: Restore pristine source-edge fixture
        id: restore-source-edge
        if: always() && matrix.platform == 'macos-arm64' && steps.source-edge-snapshot.outcome == 'success'
        shell: bash
        run: |
          cp -p "${RUNNER_TEMP}/source-edge-fixture.cj" \
            tests/fixtures/projects/source_edges/src/fixture.cj


