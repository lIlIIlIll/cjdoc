name: Daily SDK

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      sdk_version:
        description: Cangjie STS version to accept
        required: false
        type: string
        default: "1.2.0"

permissions:
  contents: read

concurrency:
  group: daily-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: linux-x64 / Cangjie ${{ inputs.sdk_version || '1.2.0' }} STS
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CJDOC_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      cjHeapSize: "512MB"
      CANGJIE_SDK_VERSION: ${{ inputs.sdk_version || '1.2.0' }}
      CJDOC_CI_EVIDENCE: ${{ github.workspace }}/target/ci-evidence
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Restore cjv toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/setup-cangjie-cjv
          # The key carries the arch, the channel/components/cjv pin and a digest of the
          # workflow files, so a configuration change must miss the cache. No
          # restore-keys: a cross-configuration reuse would hide a channel change.
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CANGJIE_SDK_VERSION }}-sts-stdx-cjv0.3.2-${{ hashFiles('.github/workflows/build-linux-candidate.yml', '.github/workflows/ci.yml', '.github/workflows/pages.yml', '.github/workflows/daily.yml') }}

      - name: Set up Cangjie STS SDK with stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: ${{ env.CANGJIE_SDK_VERSION }}
          components: stdx
          cjv-version: v0.3.2

      - name: Export authenticated stdx environment and record toolchain
        shell: bash
        run: |
          set -euo pipefail
          python scripts/with_stdx.py --variant static --print-env -- | tee -a "${GITHUB_ENV}"
          echo "resolved_cangjie_version=${CANGJIE_SDK_VERSION}"
          echo "runner_image=${ImageOS:-unknown} runner_image_version=${ImageVersion:-unknown}"
          cjc -v
          cjpm -v

      - name: Run acceptance and real-repository smoke
        shell: bash
        run: |
          set -euo pipefail
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          . scripts/with_sts_o1_cjpm.sh
          bash scripts/check.sh
          python scripts/with_stdx.py --variant static -- \
            python scripts/real_repository_smoke.py --project .

      - name: Write the timing summary
        if: always()
        shell: bash
        run: |
          python scripts/ci_stage.py summarize --evidence target/ci-evidence \
            --output "${RUNNER_TEMP}/ci-stage-summary.md" || true
          cat "${RUNNER_TEMP}/ci-stage-summary.md" >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timing-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-evidence/
          retention-days: 7
          if-no-files-found: error
