name: Daily SDK

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      sdk_version:
        description: Cangjie STS version to accept
        required: false
        type: string
        default: "1.2.0"

permissions:
  contents: read

concurrency:
  group: daily-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: linux-x64 / Cangjie ${{ inputs.sdk_version || '1.2.0' }} STS
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CJDOC_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      CANGJIE_SDK_VERSION: ${{ inputs.sdk_version || '1.2.0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Restore cjv toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/setup-cangjie-cjv
          key: cjv-home-${{ runner.os }}-${{ env.CANGJIE_SDK_VERSION }}-v1

      - name: Set up Cangjie STS SDK with stdx
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: sts
          version: ${{ env.CANGJIE_SDK_VERSION }}
          components: stdx
          cjv-version: v0.3.2

      - name: Export authenticated stdx environment and record toolchain
        shell: bash
        run: |
          set -euo pipefail
          python scripts/with_stdx.py --variant static --print-env -- | tee -a "${GITHUB_ENV}"
          echo "resolved_cangjie_version=${CANGJIE_SDK_VERSION}"
          echo "runner_image=${ImageOS:-unknown} runner_image_version=${ImageVersion:-unknown}"
          cjc -v
          cjpm -v

      - name: Run acceptance and real-repository smoke
        shell: bash
        run: |
          set -euo pipefail
          export CANGJIE_STDX_PATH="${CJDOC_STDX_PATH}"
          python scripts/with_stdx.py --variant static -- scripts/check.sh
          python scripts/with_stdx.py --variant static -- \
            python scripts/real_repository_smoke.py --project .
