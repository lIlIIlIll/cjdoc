name: Issue 49 workbench
on:
  push:
    branches: [codex/issue-49-compact-reference]
    paths: ['.github/workflows/issue-49-workbench.yml']
permissions:
  contents: read
jobs:
  native:
    if: github.ref == 'refs/heads/codex/issue-49-compact-reference'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CJDOC_PYTHON: python
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      cjHeapSize: '512MB'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply two verified native fixes to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          assert os.environ['GITHUB_REPOSITORY'] == 'lIlIIlIll/cjdoc'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/issue-49-compact-reference'
          data = base64.b64decode('')
          assert hashlib.sha256(data).hexdigest() == '2782e391dfa30cc5f4c8b9ecb050a92b2ffa8666fc46e512c15aa8c7f77f9f32'
          payload = json.loads(zlib.decompress(data))
          pending = []
          for change in payload['changes']:
              assert change['path'] in ('src/render/html_members.cj', 'src/render/html_signature.cj')
              path = pathlib.Path(change['path'])
              before = path.read_bytes()
              assert hashlib.sha256(before).hexdigest() == change['before']
              lines = before.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(change['edits']):
                  lines[start:end] = [replacement]
              after = ''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest() == change['after']
              pending.append((path, after))
          for path, after in pending:
              path.write_bytes(after)
          subprocess.run(['git','add','--'] + [str(path) for path,_ in pending], check=True)
          subprocess.run(['git','-c','user.name=Codex','-c','user.email=noreply@openai.com','commit','-m','fix(html): validate native signature alignment and optional owner types'], check=True)
          auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          print('::add-mask::' + auth, flush=True)
          subprocess.run(['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:refs/heads/codex/issue-49-compact-reference'], check=True)
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/cangjie-sdk-1.1.3
          key: cangjie-sdk-linux-x64-2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a-v3-authenticated-archive
      - name: Install pinned SDK
        id: sdk
        run: |
          python scripts/install_cangjie_sdk.py \
            --url 'https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b' \
            --sha256 2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a \
            --destination "$RUNNER_TEMP/cangjie-sdk-1.1.3" --github-output "$GITHUB_OUTPUT"
      - name: Preserve authenticated toolchain archive for offline verification
        run: |
          mkdir -p "$RUNNER_TEMP/issue-49-toolchain"
          cp "$RUNNER_TEMP/cangjie-sdk-1.1.3/.cjdoc-sdk-archive" "$RUNNER_TEMP/issue-49-toolchain/cangjie-sdk.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-49-pinned-sdk
          path: ${{ runner.temp }}/issue-49-toolchain/cangjie-sdk.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Build and native tests
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          mkdir -p target/issue-49-evidence
          source "$CANGJIE_SDK_ROOT/envsetup.sh"
          cjc -v | tee target/issue-49-evidence/sdk.log
          cjpm build 2>&1 | tee target/issue-49-evidence/build.log
          cjpm test 2>&1 | tee target/issue-49-evidence/unit.log
          target/release/bin/main generate --project tests/fixtures/projects/compact_reference --format html --format json --locale en --doc-version 1.0.0 --no-cache --output target/compact-en
          target/release/bin/main generate --project tests/fixtures/projects/compact_reference --format html --format json --locale zh-CN --doc-version 1.0.0 --no-cache --output target/compact-zh
          python scripts/validate_html_site.py target/compact-en/html
          python scripts/validate_html_site.py target/compact-zh/html
      - name: Preserve locked public dependency sources and test runner
        if: always()
        run: |
          mkdir -p target/issue-49-evidence
          if [ -d "$HOME/.cjpm/git" ]; then tar -C "$HOME/.cjpm" --exclude=.git -czf target/issue-49-evidence/dependencies.tar.gz git; fi
          npm --prefix tests/browser ci
          tar -C tests/browser -czf target/issue-49-evidence/browser-deps.tar.gz node_modules
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-49-native-evidence
          path: |
            target/issue-49-evidence
            target/compact-en
            target/compact-zh
          retention-days: 2
          if-no-files-found: warn
