name: Issue 49 workbench

on:
  push:
    branches: [codex/issue-49-compact-reference]
    paths: ['.github/workflows/issue-49-workbench.yml']

permissions:
  contents: read

jobs:
  native:
    if: github.ref == 'refs/heads/codex/issue-49-compact-reference'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CJDOC_PYTHON: python
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      cjHeapSize: '512MB'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/cangjie-sdk-1.1.3
          key: cangjie-sdk-linux-x64-2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a-v3-authenticated-archive
      - name: Install pinned SDK
        id: sdk
        run: |
          python scripts/install_cangjie_sdk.py \
            --url 'https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b' \
            --sha256 2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a \
            --destination "$RUNNER_TEMP/cangjie-sdk-1.1.3" --github-output "$GITHUB_OUTPUT"
      - name: Build and native tests
        shell: bash
        env:
          CANGJIE_SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          mkdir -p target/issue-49-evidence
          source "$CANGJIE_SDK_ROOT/envsetup.sh"
          cjc -v | tee target/issue-49-evidence/sdk.log
          cjpm build 2>&1 | tee target/issue-49-evidence/build.log
          cjpm test 2>&1 | tee target/issue-49-evidence/unit.log
          python -m unittest discover -s scripts -p 'test_*.py' 2>&1 | tee target/issue-49-evidence/python.log
          target/release/bin/main generate --project tests/fixtures/projects/compact_reference --format html --format json --locale en --doc-version 1.0.0 --no-cache --output target/compact-en
          target/release/bin/main generate --project tests/fixtures/projects/compact_reference --format html --format json --locale zh-CN --doc-version 1.0.0 --no-cache --output target/compact-zh
          python scripts/validate_html_site.py target/compact-en/html
          python scripts/validate_html_site.py target/compact-zh/html
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-49-native-evidence
          path: |
            target/issue-49-evidence
            target/compact-en
            target/compact-zh
          retention-days: 2
          if-no-files-found: warn
