name: Issue 49 workbench

on:
  push:
    branches: [codex/issue-49-compact-reference]
    paths: ['.github/workflows/issue-49-workbench.yml']

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/cjdoc-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-49-source
          path: ${{ runner.temp }}/cjdoc-source.tar.gz
          retention-days: 1
          if-no-files-found: error
