name: Codex review gate

on:
  # Gate logic always executes trusted default-branch code (no PR checkout).
  pull_request_target:
    # `closed` matters even though a closed PR needs no status: it can free a
    # HEAD that another open PR then owns alone and needs re-evaluated.
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  # The managed Codex app creates/edits its canonical summary issue comment.
  issue_comment:
    types: [created, edited, deleted]
  # Restore the status if a webhook was missed or a format changed.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true
        type: number
  # Test the proposed implementation as untrusted code, with read-only access.
  pull_request:
    paths:
      - '.github/workflows/codex-review-gate.yml'
      - 'scripts/codex_review_gate.py'
      - 'tests/test_codex_review_gate.py'

permissions:
  contents: read

concurrency:
  group: codex-review-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Codex review completion status
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted default-branch gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate current PR head and post commit status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/codex_review_gate.py

  test:
    name: Offline Codex gate tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout PR code without write permissions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run gate contract tests
        run: python3 -m unittest discover -s tests -p 'test_codex_review_gate.py' -v
